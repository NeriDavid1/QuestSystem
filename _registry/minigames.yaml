# English-learning minigame types available in Unity.
# Referenced by play_minigame via minigame_id.
# world_object_id is the Unity interactable gameId (station), NOT this type name.
# Do NOT invent types (no basic_forging, market_haggle, tempering_forge, etc.).

minigames:

  letter_ordering:
    image: images/minigames/letter_ordering.png
    name: "Letter Ordering"
    unity_config: LetterOrderingQuestConfigSO
    unity_content: LetterOrderingDataSO
    category: spelling
    description: "Arrange scrambled letter tiles to spell a target English word."
    english_focus: "Spelling, letter recognition"
    difficulty_range: [1, 6]
    content_fields:
      - prompt
      - targetWord
      - extraDistractorCount
      - customDistractors
      - visualVariant
      - promptAudio
      - hintMode
      - wordRevealDatabase
    variants:
      - word_spelling
    typical_stations: [chest, cart, tombstone, exam_table]

  listening_letter_ordering:
    image: images/minigames/listening_letter_ordering.png
    name: "Listen & Build"
    unity_config: LetterOrderingQuestConfigSO
    unity_content: LetterOrderingDataSO
    category: spelling
    description: "Listen to the assigned English recording, then arrange letters to spell the word. Separate teal and gold visuals, replay button, and optional text clue. Uses the shared Letter Ordering validation."
    english_focus: "Listening comprehension, spelling"
    difficulty_range: [1, 6]
    default_visual_variant: ListenAndBuild
    content_fields:
      - prompt
      - targetWord
      - extraDistractorCount
      - customDistractors
      - visualVariant
      - promptAudio
      - hintMode
      - wordRevealDatabase
    variants:
      - listening_spelling
    typical_stations: [chest, cart, tombstone, exam_table]

  word_ordering:
    image: images/minigames/word_ordering.png
    name: "Word Ordering"
    unity_config: WordOrderingQuestConfigSO
    unity_content: WordOrderingDataSO
    category: grammar
    description: "Arrange scrambled English word tiles into a complete sentence."
    english_focus: "Sentence structure, adjective placement"
    difficulty_range: [2, 10]
    content_fields:
      - prompt
      - translation
      - englishWordsInOrder
      - preFilledIndices
      - distractorWords
      - wordRevealDatabase
    variants:
      - sentence_building
    typical_stations: [chest, cart, exam_table]

  word_matching:
    image: images/minigames/word_matching.png
    name: "Word Matching"
    unity_config: LineMatchQuestConfigSO
    unity_content: LetterConnectionLevelConfigSO
    category: vocabulary
    description: "Match English words/fragments (includes opposite pairing / Line Match)."
    english_focus: "Vocabulary, missing-letter recognition, opposites"
    difficulty_range: [1, 8]
    content_fields:
      - letters
      - wordTasks
    variants:
      - word_to_image
      - letter_to_gap
      - opposite_pairing
    typical_stations: [chest, exam_table]

  letter_drawing:
    image: images/minigames/letter_drawing.png
    name: "Letter Drawing"
    unity_config: LetterTracingQuestConfigSO
    unity_content: TracingLessonSO
    category: motor_skills
    description: "Type letters or English words in the order they should be traced. Each entry is one round; letter case is preserved."
    english_focus: "Letter formation, stroke order"
    difficulty_range: [1, 4]
    content_fields:
      - symbols
    variants:
      - trace_guided
    typical_stations: [shop, chest, cart]

  speak_aloud:
    image: images/minigames/speak_aloud.png
    name: "Speak Aloud"
    unity_config: SpeakAloudQuestConfigSO
    unity_content: SpeakAloudDataSO
    category: pronunciation
    description: "Say an English word or phrase; speech recognition validates it."
    english_focus: "Pronunciation, spoken production"
    difficulty_range: [4, 10]
    content_fields:
      - prompt
      - targetWords
      - targetPhrase
      - silenceTimeoutSeconds
      - allowFuzzyMatch
      - referenceClip
      - wordRevealDatabase
    variants:
      - single_word
      - short_phrase
    typical_stations: [fire_camp, cart, chest]
    requires_microphone: true

  dwarf_miner:
    image: images/minigames/dwarf_miner.png
    name: "Dwarf Miner"
    unity_config: DwarfMinerQuestConfigSO
    unity_content: MinerCategoryDataSO
    category: vocabulary
    description: "Swing the dwarf's hook to collect the words that belong to a category and avoid the ones that don't."
    english_focus: "Vocabulary categories, word meaning"
    difficulty_range: [1, 8]
    content_fields:
      - prompt
      - categoryLabel
      - targetWords
      - distractorWords
      - requiredCorrect
      - allowedMistakes
      - background
      - wordRevealDatabase
    variants:
      - word_category
    typical_stations: [chest, exam_table]

  fruit_slice:
    image: images/minigames/fruit_slice.png
    name: "Fruit Slice"
    unity_config: FruitSliceQuestConfigSO
    unity_content: SliceOrderingDataSO
    category: spelling
    description: "Slice flying fruit in the right order to spell a word (letters) or build a sentence (words)."
    english_focus: "Spelling, sentence order"
    difficulty_range: [1, 8]
    content_fields:
      - prompt
      - segmentation
      - targetText
      - preFilledIndices
      - distractors
      - extraLetterDistractorCount
      - background
      - wordRevealDatabase
    variants:
      - letter_slicing
      - word_slicing
    typical_stations: [chest, exam_table]
