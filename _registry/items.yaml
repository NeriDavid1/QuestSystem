# Item registry — inventoriable shippable rewards need softkitty_id.
# SoftKitty IDs come from Unity Assets/_ThirdParty/SoftKitty/Data/ItemObject.asset.
# Do not invent new SoftKitty items without adding them in Unity first.

items:

  # SoftKitty stackables used by live Adjective Crown quests
  herbs: { name: "Herbs", type: material, softkitty_id: 5, softkitty_uid: herbs, max_stack: 99 }
  oak_log: { name: "Oak Log", type: material, softkitty_id: 10, softkitty_uid: oak_log, max_stack: 99 }
  corn: { name: "Corn", type: material, softkitty_id: 20, softkitty_uid: corn, max_stack: 99 }
  gem: { name: "Gem", type: material, softkitty_id: 26, softkitty_uid: gem, max_stack: 99 }
  power_stone: { name: "Power Stone", type: material, softkitty_id: 59, softkitty_uid: power_stone, max_stack: 99 }
  ancient_rune: { name: "Ancient Rune", type: material, softkitty_id: 60, softkitty_uid: ancient_rune, max_stack: 99 }

  # Quest completion currency (string reward path on q06)
  coin: { name: "Coin", type: currency }

  # Blacksmith Will — combat unlock token (authoring; wire ability_id in Unity later)
  slash_ability:
    name: "Slash Ability"
    type: ability_unlock
    ability_id: slash
    description: "Unlocks the Slash combat ability when granted as a quest reward."

  # English Kingdom Maya letter collectibles (authoring line; not SoftKitty yet)
  letter_a: { name: "Letter A", type: quest_item }
  letter_b: { name: "Letter B", type: quest_item }
  letter_c: { name: "Letter C", type: quest_item }
  letter_d: { name: "Letter D", type: quest_item }
  letter_e: { name: "Letter E", type: quest_item }
  letter_f: { name: "Letter F", type: quest_item }
  letter_g: { name: "Letter G", type: quest_item }
  letter_h: { name: "Letter H", type: quest_item }
  letter_i: { name: "Letter I", type: quest_item }
  letter_j: { name: "Letter J", type: quest_item }
  word_hero_badge: { name: "Word Hero Badge", type: accessory }
