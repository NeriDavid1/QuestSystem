# The Kingdom's Worst Day homework - on the evening after the fair, the wind mixes up the word cards
# on the fair's board by the gate, and Fenn (City Gaurd Info) wants to see the learner fix it alone.
# Homework teaches nothing new: no rule before practice, a short rule reminder at the end.
# Hebrew-first, short blocks. No quotation marks inside dialogue text. No em dash.
dialogues:

  the_kingdoms_worst_day_homework_q01_start:
    speaker: City Gaurd Info
    lines:
      - "איזה יום! בזכותכם היריד עבר נהדר, וכולם ליד השער עוד מדברים עליכם."
      - "אבל רוח הערב העיפה את כרטיסי המילים מהלוח של היריד, והכול התערבב."
      - "אין פה שום דבר חדש, את כל המילים אתם כבר מכירים. תראו לי שאתם יודעים לסדר את הלוח לבד."
      - "את כל הכרטיסים אספתי לעגלה שליד השער. צריך לסיים לפני שמחשיך."

  the_kingdoms_worst_day_homework_q01_finish:
    speaker: City Gaurd Info
    lines:
      - "הלוח שוב מסודר, והשער הגדול נסגר בזמן. היום הכי גרוע של הממלכה נגמר טוב."
      - "זכרו: noun = שם עצם, שם של דבר. verb = פועל, מה עושים. adjective = שם תואר, איך הדבר נראה. באנגלית הוא בא לפני שם העצם: the big gate = השער הגדול."
      - "כל הכבוד. עשיתם את שיעורי הבית לבד, ומחר כל מי שעובר בשער ישמע על זה."
