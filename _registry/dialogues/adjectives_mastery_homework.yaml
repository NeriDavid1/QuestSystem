# The Adjectives Mastery homework - Maya's answer cards. The lesson ended with Maya running off to study
# because the learners became masters before her; now she checks her own cards against theirs. Maya is feminine throughout.
# Homework teaches nothing new: no rule before practice, a short rule reminder at the end.
# Hebrew-first, short blocks. No quotation marks inside dialogue text. No em dash.
dialogues:

  adjectives_mastery_homework_q01_start:
    speaker: teacher_maya
    lines:
      - "שלום שוב, מאסטרים של שמות תואר! אחרי שהפכתם למאסטרים לפניי, רצתי ללמוד כל הלילה."
      - "עכשיו אני רוצה לבדוק את עצמי. כתבו כרטיסי תשובות ושימו אותם בתיבה ליד העץ הגדול, ואני אשווה אותם לכרטיסים שלי."
      - "היום אין שום דבר חדש. אתם המאסטרים, אז כתבו את הכרטיסים לבד, בלי עזרה."

  adjectives_mastery_homework_q01_finish:
    speaker: teacher_maya
    lines:
      - "הכרטיסים שלכם והכרטיסים שלי זהים. עכשיו גם אני מאסטרית של שמות תואר, בזכותכם."
      - "זכרו: שם התואר בא לפני שם העצם. a sharp sword = חרב חדה."
      - "סיומת er אומרת יותר: dark = חשוך, darker than day = חשוך יותר מיום."
      - "כל הכבוד, מאסטרים. עשיתם את שיעורי הבית לבד."
