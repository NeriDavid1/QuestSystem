# Local dialogue scripts for The Lost & Found Cart.
dialogues:
  the_royal_impostor_q01_fenn_start:
    speaker: City Gaurd Info
    lines:
      - 'אחרי החגיגה נשארו בכיכר כמה דברים.'
      - 'השומרים שמו הכול בעגלה, אבל אנחנו לא יודעים למי כל דבר שייך.'
      - 'ויל אומר שהפטיש שלו נמצא בתוך Lost Chest 1 בבית הבנאים.'
      - 'לכו אל התיבה, מצאו את הפטיש ועזרו לנו לבדוק למי הוא שייך.'
      - 'אחר כך תמשיכו אל הציירת.'
      - 'Go to Will the Blacksmith.'
  the_royal_impostor_q01_will_witness:
    speaker: Blacksmith
    lines:
      - 'שלום! הפטיש שלי נמצא בתוך התיבה בבית הבנאים.'
      - 'בבקשה לכו לשם וחפשו אותו.'
      - 'כשתמצאו את הפטיש, השלימו את המשפט כדי להראות שהוא שלי.'
      - 'This is his hammer.'
      - 'זה הפטיש שלו.'
      - 'אחר כך לכו אל הציירת. גם לה חסר כלי עבודה.'
  the_royal_impostor_q01_painter_witness:
    speaker: Painter
    lines:
      - 'המברשת שלי נמצאת בתוך Lost Chest 7 ליד עץ צריח השמש.'
      - 'לכו לשם וחפשו את המברשת.'
      - 'כשתמצאו אותה, השלימו את המשפט כדי להראות שהיא שלי.'
      - 'This is her brush.'
      - 'זאת המברשת שלה.'
      - 'אחר כך אמרו בקול את משפט העדים ליד שולחן הבחינה.'
      - 'בסוף חזרו לשומר וספרו מה מצאתם.'
  the_royal_impostor_q01_fenn_clue:
    speaker: City Gaurd Info
    lines:
      - 'מצוין! בדקתם את הפטיש ואת המברשת.'
      - 'על ויל אמרנו his hammer - הפטיש שלו.'
      - 'על הציירת אמרנו her brush - המברשת שלה.'
      - 'עכשיו צריך לבדוק את ארוחת הצהריים של השומרים.'
      - 'לכו אל טומלין בשער הראשי.'
      - 'Go to Tomlin at the Main Gate.'
  the_royal_impostor_q02_tomlin_start:
    speaker: Main Gate Gaurd 1
    lines:
      - 'אוי לא! הכריכים שלנו נעלמו.'
      - 'הם נמצאים ליד שולחן הבחינה, ואנחנו צריכים לבדוק למי הם שייכים.'
      - 'אנחנו השומרים מדברים על עצמנו, לכן נשתמש ב our.'
      - 'אחר כך ספרו על השומרים מבחוץ, עם their.'
      - 'בסוף אמרו בקול את משפט ארוחת הצהריים ליד העגלה.'
      - 'אחרי זה לכו אל גאריק. הוא מצא רמז.'
  the_royal_impostor_q02_garrick_witness:
    speaker: Main Gate Gaurd 2
    lines:
      - 'הרמז שלי נמצא ליד העגלה.'
      - 'קחו אותו ובדקו את המשפט הראשון ליד התיבה.'
      - 'אני מדבר אליכם ישירות, לכן הרמז הוא your clue.'
      - 'זה הרמז שלכם.'
      - 'אחר כך בדקו את המשפט של החשוד על הכריכים.'
      - 'בסוף אמרו בקול את האזהרה ליד שולחן הבחינה.'
      - 'כשסיימתם, חזרו לשומר העיר.'
  the_royal_impostor_q02_fenn_clue:
    speaker: City Gaurd Info
    lines:
      - 'עבודה טובה! בדקתם את הכריכים ואת הרמז.'
      - 'השומרים אמרו our sandwiches - הכריכים שלנו.'
      - 'כשדיברנו עליהם מבחוץ, אמרנו their sandwiches - הכריכים שלהם.'
      - 'ליד העגלה מצאנו גם רשימה קרועה.'
      - 'הציירת יכולה לעזור לתקן אותה.'
      - 'Go to the Painter.'
  the_royal_impostor_q03_fenn_start:
    speaker: Painter
    lines:
      - 'הרשימה הזאת קרועה, וכמה אותיות נעלמו מהמילים.'
      - 'בלי האותיות האלה קשה להבין למי הדברים שייכים.'
      - 'לכו קודם לשולחן הבחינה והשלימו את האותיות החסרות.'
      - 'אחר כך לכו לעגלה ובנו שני משפטים על ויל, הציירת והשומרים.'
      - 'המשפטים יעזרו לנו לקרוא את הרשימה.'
  the_royal_impostor_q03_fenn_done:
    speaker: Painter
    lines:
      - 'הצלחתם לתקן את הרשימה!'
      - 'עכשיו אפשר לקרוא מי קשור לכל חפץ.'
      - 'בתחתית הרשימה יש סימן של תיבת האבידות.'
      - 'ויל מכיר את הקוד של התיבה ויכול לעזור לנו לפתוח אותה.'
      - 'קחו אליו את הרשימה.'
      - 'Go to Will the Blacksmith.'
  the_royal_impostor_q04_fenn_start:
    speaker: Blacksmith
    lines:
      - 'אני מכיר את הסימן הזה. זה הקוד של תיבת האבידות.'
      - 'כדי לפתוח את התיבה צריך לבדוק מי מדבר ולמי שייך כל דבר.'
      - 'התחילו ליד העגלה עם my ו your.'
      - 'אחר כך פתרו את משפט הבדיקה ליד שולחן הבחינה.'
      - 'חזרו לעגלה עם our ו their, ואמרו בקול את משפט הקוד.'
      - 'בסוף בדקו ליד העגלה את his ו her, ואז פתרו את הבדיקה האחרונה.'
      - 'כך נוכל לפתוח את התיבה בלי לקחת דבר שלא שייך לנו.'
  the_royal_impostor_q04_fenn_done:
    speaker: Blacksmith
    lines:
      - 'כל הכבוד! בדקתם את כל שש המילים.'
      - 'עכשיו הקוד ברור, ותיבת האבידות יכולה להיפתח.'
      - 'הרשימה מוכנה, ונשאר רק לבדוק את הדברים האחרונים.'
      - 'קחו את הרשימה אל שומר העיר.'
      - 'Go back to the City Guard.'
  the_royal_impostor_q05_fenn_start:
    speaker: City Gaurd Info
    lines:
      - 'זה השלב האחרון של החיפוש.'
      - 'עכשיו נבדוק את כל הדברים שנמצאו בתוך התיבה.'
      - 'התחילו ליד שולחן הבחינה ובדקו את המשפט של המלך אליכם.'
      - 'אחר כך לכו לעגלה ואמרו בקול את אותו משפט.'
      - 'בנו שם גם את המשפט על הפטיש של ויל ועל המברשת של הציירת.'
      - 'אחר כך אמרו את משפט העדים ליד שולחן הבחינה.'
      - 'בסוף השלימו את המשפט של המלך על השומרים.'
      - 'אחרי כל הבדיקות חזרו אליי עם התשובה.'
  the_royal_impostor_q05_fenn_checked:
    speaker: City Gaurd Info
    lines:
      - 'בדקתי את התשובות שלכם. כל דבר מתאים לבעלים הנכון.'
      - 'הפטיש הוא his hammer - הפטיש שלו.'
      - 'המברשת היא her brush - המברשת שלה.'
      - 'הכריכים הם their sandwiches - הכריכים שלהם.'
      - 'נשאר רק לסגור את החיפוש ולסדר את העגלה.'
  the_royal_impostor_q05_fenn_done:
    speaker: City Gaurd Info
    lines:
      - 'הצלחתם! כל הדברים חזרו לבעלים שלהם.'
      - 'ויל יקבל את הפטיש שלו.'
      - 'הציירת תקבל את המברשת שלה.'
      - 'השומרים מצאו את הכריכים שלהם.'
      - 'ועכשיו אנחנו יודעים להשתמש ב my, your, his, her, our ו their.'
      - 'רגע... השומרים כבר אכלו את הכריכים.'
      - 'טוב, לפחות מצאנו אותם בזמן! כל הכבוד.'
      - 'קבלו 10 מטבעות.'
