# Local dialogue scripts for The Royal Impostor.
dialogues:
  the_royal_impostor_q01_fenn_start:
    speaker: City Gaurd Info
    lines:
      - 'יש צרה מלכותית: שני אנשים טוענים שהם היועץ האמיתי.'
      - 'שניהם אומרים: I am the Royal Advisor!'
      - 'שניהם אומרים: אני היועץ המלכותי!'
      - 'היועץ האמיתי מכיר את אנשי הממלכה ואת החפצים שלהם. אספו עדויות מוויל ומהציירת.'
  the_royal_impostor_q01_will_witness:
    speaker: Blacksmith
    lines:
      - 'אני ויל הנפח, והפטיש הזה שייך לי.'
      - 'This is my hammer.'
      - 'זה הפטיש שלי.'
      - 'עכשיו דווחו עליי בגוף שלישי לפי המשמעות בעברית.'
      - 'עכשיו דווחו עליי: זה הפטיש שלו.'
  the_royal_impostor_q01_painter_witness:
    speaker: Painter
    lines:
      - 'אני הציירת, והמברשת הזאת שייכת לי.'
      - 'This is my brush.'
      - 'זאת המברשת שלי.'
      - 'עכשיו דווחו עליי בגוף שלישי לפי המשמעות בעברית.'
      - 'עכשיו דווחו עליי: זאת המברשת שלה.'
  the_royal_impostor_q01_fenn_clue:
    speaker: City Gaurd Info
    lines:
      - 'יפה! שיניתם את המילה לפי מי שמדבר ולפי בעל החפץ.'
      - 'Clue number one: the impostor confuses his and her.'
      - 'רמז מספר אחת: המתחזה מתבלבל בין שלו לשלה.'
      - 'עכשיו דברו עם השומרים. מישהו נגע בארוחת הצהריים שלהם.'
  the_royal_impostor_q02_tomlin_start:
    speaker: Main Gate Gaurd 1
    lines:
      - 'מישהו לקח את ארוחת הצהריים של שנינו, ואני הייתי ער מספיק כדי לראות את זה.'
      - 'Someone ate our lunch!'
      - 'מישהו אכל את ארוחת הצהריים שלנו!'
      - 'These are our sandwiches.'
      - 'אלה הכריכים שלנו.'
      - 'כשאתם מדווחים עלינו, נקודת המבט משתנה.'
  the_royal_impostor_q02_garrick_witness:
    speaker: Main Gate Gaurd 2
    lines:
      - 'מצאתי רמז ליד העגלה. אני נותן אותו לכם.'
      - 'This is your clue.'
      - 'זה הרמז שלכם.'
      - 'החשוד החזיק בכריכים ואמר: These are my sandwiches.'
      - 'החשוד החזיק בכריכים ואמר: אלה הכריכים שלי.'
      - 'המשפט היה תקין, אבל הטענה הייתה שקרית.'
  the_royal_impostor_q02_fenn_clue:
    speaker: City Gaurd Info
    lines:
      - 'מצוין. השומרים אמרו our, ואתם דיווחתם עליהם בעזרת their.'
      - 'מצוין. השומרים אמרו "שלנו", ואתם דיווחתם עליהם בעזרת "שלהם".'
      - 'Clue number two: the impostor claims other people’s things are his.'
      - 'רמז מספר שתיים: המתחזה טוען שחפצים של אחרים שייכים לו.'
      - 'אבל החשוד קרע את דף העדות. צריך לשחזר את מילות השייכות שנפגעו.'
  the_royal_impostor_q03_fenn_start:
    speaker: City Gaurd Info
    lines:
      - 'החשוד קרע את העדות, ובכל מילת שייכות חסרה אות.'
      - 'שחזרו תחילה את המילים הקצרות, ואחר כך את המילים שמשנות נקודת מבט.'
      - 'לבסוף השתמשו במילים המתוקנות בשני משפטי עדות.'
  the_royal_impostor_q03_fenn_done:
    speaker: City Gaurd Info
    lines:
      - 'כל מילות השייכות חזרו לעדות, ושני הדוחות שוב ברורים.'
      - 'הרמז הבא נעול בקוד. כדי לפתוח אותו צריך לכתוב את שש המילים באנגלית.'
  the_royal_impostor_q04_fenn_start:
    speaker: City Gaurd Info
    lines:
      - 'הקוד בודק אם אתם יודעים לכתוב כל מילה לפי הדובר ולפי בעל החפץ.'
      - 'כתבו שתי מילים, השלימו משפט בדיקה, והמשיכו לזוג הבא.'
      - 'אחרי שתפתחו את כל הקוד, המלך ישלח את המבחן האחרון.'
  the_royal_impostor_q04_fenn_done:
    speaker: City Gaurd Info
    lines:
      - 'הקוד נפתח. כתבתם את כל שש מילות השייכות והשתמשתם בהן בהקשר.'
      - 'המלך שלח את המבחן האחרון. עכשיו נבדוק יחד את כל העדויות.'
  the_royal_impostor_q05_fenn_start:
    speaker: City Gaurd Info
    lines:
      - 'המלך אומר שהיועץ האמיתי יודע למי שייך כל דבר בממלכה.'
      - 'My real advisor knows this kingdom better than anyone.'
      - 'היועץ האמיתי שלי מכיר את הממלכה הזאת טוב יותר מכולם.'
      - 'במשפט הראשון המלך מדבר ישירות אליכם. במשפט האחרון הוא מדבר אל השומרים.'
      - 'השלימו את שלושת המשפטים, ואז אמרו שניים מהם בקול כדי למסור את התשובה.'
  the_royal_impostor_q05_fenn_done:
    speaker: City Gaurd Info
    lines:
      - 'הצלחתם! כל העדויות מתאימות, והמתחזה לא ידע למי שייכים החפצים.'
      - 'בסוף הוא הודה שהוא שחקן מהתיאטרון המלכותי שרצה לקבל ארוחה חינם בארמון.'
      - 'השומרים צעקו: “Our lunch?!” — “ארוחת הצהריים שלנו?!”'
      - 'חשפתם את המתחזה המלכותי וסיימתם את כל החקירה.'
      - 'כל הכבוד! קבלו עכשיו 10 מטבעות.'
