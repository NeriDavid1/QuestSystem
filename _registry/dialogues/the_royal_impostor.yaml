# Local dialogue scripts for The Royal Impostor.
dialogues:
  the_royal_impostor_q01_fenn_start:
    speaker: City Gaurd Info
    lines:
      - 'אחרי החגיגה נשארו בכיכר הרבה דברים.'
      - 'השומרים אספו את כולם לעגלה.'
      - 'אבל אנחנו לא יודעים למי הם שייכים.'
      - 'נתחיל עם הפטיש והמברשת.'
      - 'קודם קחו את הפטיש לוויל הנפח.'
      - 'Go to Will the Blacksmith.'
  the_royal_impostor_q01_will_witness:
    speaker: Blacksmith
    lines:
      - 'היי! זה הפטיש שלי!'
      - 'חיפשתי אותו בכל מקום.'
      - 'This is my hammer.'
      - 'זה הפטיש שלי.'
      - 'עכשיו קחו את המברשת לציירת.'
      - 'Go to the Painter.'
  the_royal_impostor_q01_painter_witness:
    speaker: Painter
    lines:
      - 'הנה המברשת שלי!'
      - 'חיפשתי אותה מאז החגיגה.'
      - 'This is my brush.'
      - 'זאת המברשת שלי.'
      - 'חזרו לשומר וספרו לו שמצאתם את הבעלים.'
      - 'Go back to the City Guard.'
  the_royal_impostor_q01_fenn_clue:
    speaker: City Gaurd Info
    lines:
      - 'מעולה! מצאתם את שני הבעלים.'
      - 'הפטיש שייך לוויל - his hammer.'
      - 'המברשת שייכת לציירת - her brush.'
      - 'אבל נשארו עוד דברים בעגלה.'
      - 'השומרים בשער מחפשים משהו ששייך להם.'
      - 'Go to Tomlin at the Main Gate.'
  the_royal_impostor_q02_tomlin_start:
    speaker: Main Gate Gaurd 1
    lines:
      - 'רגע... אלה הכריכים שלנו!'
      - 'These are our sandwiches.'
      - 'אלה הכריכים שלנו.'
      - 'חיפשנו אותם כל היום!'
      - 'גאריק מצא משהו ליד העגלה.'
      - 'Go to Garrick.'
  the_royal_impostor_q02_garrick_witness:
    speaker: Main Gate Gaurd 2
    lines:
      - 'תודה! כבר חשבתי שנישאר רעבים.'
      - 'מצאתי משהו ליד העגלה.'
      - 'הנה, קחו את הרמז הזה.'
      - 'This is your clue.'
      - 'זה הרמז שלכם.'
      - 'קחו את הרמז לשומר.'
      - 'Go back to the City Guard.'
  the_royal_impostor_q02_fenn_clue:
    speaker: City Gaurd Info
    lines:
      - 'יפה! גם הכריכים מצאו את הבעלים שלהם.'
      - 'אלה הכריכים של השומרים - their sandwiches.'
      - 'והרמז שקיבלתם יעזור לנו להמשיך.'
      - 'מצאנו גם רשימה קרועה ליד העגלה.'
      - 'אולי הציירת תוכל לתקן אותה.'
      - 'Go to the Painter.'
  the_royal_impostor_q03_fenn_start:
    speaker: Painter
    lines:
      - 'אוי... הרשימה הזאת ממש קרועה.'
      - 'גם כמה אותיות נעלמו.'
      - 'בלי הרשימה לא נדע למי שייכים שאר הדברים.'
      - 'בואו נראה אם אפשר לתקן אותה.'
  the_royal_impostor_q03_fenn_done:
    speaker: Painter
    lines:
      - 'הצלחתם! עכשיו הרשימה שוב ברורה.'
      - 'אבל תראו את הסימן הזה למטה.'
      - 'הוא שייך לארגז האבידות.'
      - 'ויל מכיר את המנעול של הארגז.'
      - 'קחו אליו את הרשימה.'
      - 'Go to Will the Blacksmith.'
  the_royal_impostor_q04_fenn_start:
    speaker: Blacksmith
    lines:
      - 'כן, אני מכיר את הארגז הזה.'
      - 'השומרים שומרים בו דברים שאבדו.'
      - 'אבל הארגז נעול.'
      - 'נראה שיש כאן גם קוד.'
      - 'בואו ננסה לפתוח אותו.'
  the_royal_impostor_q04_fenn_done:
    speaker: Blacksmith
    lines:
      - 'הצלחתם! הארגז פתוח.'
      - 'תראו, נשארו בפנים עוד כמה דברים.'
      - 'עכשיו צריך לגלות למי הם שייכים.'
      - 'קחו את הארגז ואת הרשימה לשומר.'
      - 'Go back to the City Guard.'
  the_royal_impostor_q05_fenn_start:
    speaker: City Gaurd Info
    lines:
      - 'כמעט סיימנו!'
      - 'נשארו רק הדברים שהיו בתוך הארגז.'
      - 'צריך לגלות למי כל אחד מהם שייך.'
      - 'אחרי זה נוכל לסגור את עגלת האבידות.'
      - 'בואו נחזיר את הדברים האחרונים.'
  the_royal_impostor_q05_fenn_checked:
    speaker: City Gaurd Info
    lines:
      - 'מעולה! מצאתם למי שייך כל דבר.'
      - 'הפטיש של ויל - his hammer.'
      - 'המברשת של הציירת - her brush.'
      - 'הכריכים של השומרים - their sandwiches.'
      - 'עכשיו אפשר להחזיר הכול לבעלים.'
  the_royal_impostor_q05_fenn_done:
    speaker: City Gaurd Info
    lines:
      - 'הצלחתם!'
      - 'הפטיש חזר לוויל.'
      - 'המברשת חזרה לציירת.'
      - 'והכריכים חזרו לשומרים.'
      - 'כל הדברים שאבדו חזרו לבעלים שלהם.'
      - 'רגע... איפה הכריכים?'
      - 'אה, השומרים כבר אכלו אותם.'
      - 'טוב, לפחות מצאנו אותם בזמן!'
      - 'כל הכבוד! קבלו 10 מטבעות.'
