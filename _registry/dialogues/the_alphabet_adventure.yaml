dialogues:
  the_alphabet_adventure_q01_start:
    speaker: Old Man
    lines:
    - אני אורן. הערב אספר סיפור בחגיגת הממלכה, אבל הספר שלי נעול בתיבה ושכחתי איפה המפתח.
    - כתבתי לעצמי רמזים. חלק מהאותיות נמחקו, וברמז הראשון מצויר תפוח. בוא נפענח אותו יחד.
    - נתחיל באות A, שנקראת איי. A היא הצורה הגדולה, ו-a היא הצורה הקטנה. זאת אותה אות.
    - A היא אות ניקוד באנגלית. כאן זאת אות שכותבים בשורה, והיא עוזרת לייצג צליל. בעברית סימני הניקוד הם סימנים סביב
      האותיות.
    - A היא מיוחדת ויש לה כמה צלילים. Apple פירושו תפוח. Acorn פירושו בלוט. שתי המילים מתחילות באותה אות, אבל הצליל
      הראשון שונה.
    - בתחילת acorn הצליל דומה לשם האות איי. בתחילת apple נשמע צליל אחר. עכשיו נקשיב להקלטה של apple, ובשיעורי הבית
      נחזור גם ל-acorn.
    - שם האות והצליל שלה בתוך מילה אינם תמיד אותו הדבר. אין צורך לקרוא או לכתוב את כל המילים האלה.
    - בשולחן הלימוד שבפארק תצייר A ו-a. במכרה תאסוף אותן, ואחר כך תקשיב למילת הרמז ותבחר את האות שלה.
    - לסיום תחתוך a שלוש פעמים. הסימנים האחרים הם רק אפשרויות להבחנה; היום לומדים את A.
  the_alphabet_adventure_q01_finish:
    speaker: Old Man
    lines:
    - תפוח! עכשיו אני נזכר שלקחתי תפוח כשיצאתי מהבקתה.
    - תרגלת את שתי הצורות של האות שלנו. ברמז הבא מצויר התיק שלי. אולי הוא יזכיר לי מה קרה אחר כך.
  the_alphabet_adventure_q02_start:
    speaker: Old Man
    lines:
    - ברמז הבא מצויר התיק שלי. הוא היה כבד מהרגיל, וגם השמיע רחש. מעניין מה הסתתר בו.
    - Bag פירושו תיק. האות הראשונה היא B, שנקראת בי. B היא הצורה הגדולה, ו-b הקטנה.
    - בהקלטה תקשיב לתחילת bag, המילה האנגלית לתיק. הצליל הראשון שייך ל-B. כדי לחבר צלילים, נשתמש בצליל הזה ולא בשם
      בי.
    - אחרי B נחבר A עם הצליל שלה בהקלטה של apple. נקבל צירוף שנכתוב בקירוב בא בעברית. זה צירוף לתרגול, ולא מילה
      באנגלית.
    - העברית עוזרת לזכור את הצירוף בקירוב. את הצליל האנגלי של A מכירים דרך ההקלטה של apple.
    - בשולחן שבפארק תצייר B ו-b, תאסוף את שתי הצורות ותאזין לרמז של התיק.
    - אחר כך תחבר שתי אותיות ותשלים רק את תחילת המילה. הסוף כבר כתוב, ואין צורך לקרוא את כולו לבד.
  the_alphabet_adventure_q02_finish:
    speaker: Old Man
    lines:
    - נכון, לקחתי את התיק. התפוח היה בפנים, אבל שמעתי ממנו רחש מוזר.
    - ברמז הבא מצויר מי שהתחבא בו. לא ידעתי שיש לי אורח בתיק!
  the_alphabet_adventure_q03_start:
    speaker: Old Man
    lines:
    - ברמז מצויר חתול. עכשיו אני מתחיל להבין מאיפה בא הרחש.
    - Cat פירושו חתול. האות החדשה היא C, שנקראת סי. C גדולה ו-c קטנה הן אותה אות.
    - בתחילת cat, המילה האנגלית לחתול, C נשמעת כמו הצליל בתחילת המילה קרן בעברית. תקשיב גם לדוגמה באנגלית.
    - ל-C יש גם צלילים אחרים. היום נשתמש בצליל שלה בדוגמה של החתול.
    - נחבר את הצליל הזה ל-A עם הצליל שלה בהקלטה של apple. נכתוב את הצירוף בקירוב קא בעברית. זה תרגול של שני צלילים,
      ולא מילה באנגלית.
    - בשולחן שבפארק תצייר C ו-c, תאסוף אותן ותקשיב למילת הרמז.
    - אחר כך תחבר שתי אותיות ותשלים רק את האות הראשונה במילה חתול. הסוף כבר כתוב, כי עוד לא למדנו את כולו.
  the_alphabet_adventure_q03_finish:
    speaker: Old Man
    lines:
    - החתול שלי! הוא התחבא בתיק, וכשפתחתי אותו הוא קפץ החוצה.
    - החזקתי את המפתח באותו רגע. הרמז האחרון הוא הכתובת שעל הכרית שקיבלתי מהבת שלי.
  the_alphabet_adventure_q04_start:
    speaker: Old Man
    lines:
    - ברמז האחרון מצוירת הכרית שהבת שלי נתנה לי. היא רקמה עליה הקדשה, אבל חלק מהכתב ברמז נמחק.
    - האות החדשה היא D, שנקראת די. D היא הצורה הגדולה, ו-d הקטנה. בתחילת dog, שפירושה כלב, שומעים את הצליל שלה.
    - השם די שונה מהצליל בתחילת dog. הקשב להקלטה כדי להכיר את הצליל.
    - ל-b יש קו גבוה משמאל לבטן, ול-d יש קו גבוה מימין לבטן. בדוק את הצורות באנגלית לפני שתבחר.
    - נחבר D ואחריה A עם הצליל שלה בהקלטה של apple. נכתוב את הצירוף בקירוב דא בעברית. זה תרגול, ולא מילה באנגלית.
    - 'עכשיו נוסיף עוד D בסוף: dad. Dad פירושו אבא. זאת מילה אמיתית שכל האותיות שלה כבר מוכרות לך.'
    - אם נחליף את האות הראשונה ב-B נקבל bad. Bad פירושו רע. שינוי האות הראשונה משנה גם את הצליל ואת המשמעות.
    - בשולחן שבפארק תצייר D ו-d, תאסוף אותן, תחבר את הצירוף ותאזין למילים.
    - לסיום תחתוך את האותיות של אבא לפי הסדר. צריך d בהתחלה וגם d בסוף.
  the_alphabet_adventure_q04_finish:
    speaker: Old Man
    lines:
    - Dad, אבא! הבת שלי רקמה את המילה על הכרית ליד החלון.
    - כשהחתול קפץ, הנחתי שם את המפתח והרמתי אותו בשתי הידיים. עכשיו נזכרתי איפה לחפש.
    - מצאתי את המפתח ופתחתי את התיבה. הספר בפנים, ובחגיגה אספר איך עזרת לי.
    - אני נותן לך 5 מטבעות על העזרה. אותיות הן כמו מפתחות קטנים לסיפורים.
    - מאיה הכינה לך עוד שלושה תרגולים קצרים לשיעורי הבית.
  the_alphabet_adventure_q05_start:
    speaker: teacher_maya
    lines:
    - הספר של אורן מוכן לחגיגה. אני מאיה, ולפני השיעור הבא נחזור על ארבע האותיות שלמדת.
    - במכרה הראשון תאסוף רק אותיות גדולות. במכרה השני תאסוף רק אותיות קטנות. שים לב לצורה, לא לגודל הציור על המסך.
    - אחר כך תצייר b ו-d. ב-b הקו הגבוה משמאל לבטן, וב-d הוא מימין.
    - התרגולים מחכים לך בשולחן הלימוד שבפארק.
  the_alphabet_adventure_q05_finish:
    speaker: teacher_maya
    lines:
    - כל הכבוד. הבחנת בין צורות גדולות וקטנות וחזרת על שתי האותיות שקל לבלבל.
    - בתרגול הבא תחבר אותיות לצירופים קצרים.
  the_alphabet_adventure_q06_start:
    speaker: teacher_maya
    lines:
    - אורן רוצה להציג בחגיגה את הרמזים שפתרת. היום נחזור אליהם בכמה דרכים.
    - תרכיב את הצירוף קא, ואחר כך תחתוך את האותיות של בא. אלו צירופים לתרגול, ולא מילים באנגלית.
    - בכל צירוף נשמור על הצליל של A בהקלטה של apple. הכתיבה בעברית מזכירה את סדר הצלילים בקירוב.
    - בסוף תקשיב למילה acorn, שפירושה בלוט. היא מתחילה ב-A עם צליל שדומה לשם האות איי.
    - זו אותה אות ניקוד של תפוח, אבל הצליל הראשון שונה. בחר רק את האות של הצליל הראשון, בלי לכתוב את המילה כולה.
  the_alphabet_adventure_q06_finish:
    speaker: teacher_maya
    lines:
    - חיברת צירופים בשתי דרכים וחזרת על אות הניקוד A דרך דוגמה נוספת.
    - ב-apple וב-acorn זו אותה אות עם צלילים שונים. בתרגול האחרון נרכיב שתי מילים אמיתיות שכבר למדת.
  the_alphabet_adventure_q07_start:
    speaker: teacher_maya
    lines:
    - לסיום נחזור על שתי מילים אמיתיות. Dad פירושו אבא, ו-bad פירושו רע.
    - הסוף שלהן זהה, והאות הראשונה משנה את הצליל ואת המשמעות.
    - בשולחן שבפארק תרכיב מילה לפי המשמעות, תקשיב למילה נוספת ותסיים בחיתוך אותיות לפי הסדר.
    - כשמעשה הוא רע, אפשר לתקן אותו. טעות בתרגול היא חלק מהלמידה.
  the_alphabet_adventure_q07_finish:
    speaker: teacher_maya
    lines:
    - סיימת את ההרפתקה ואת שלושת תרגולי הבית. הכרת את A, B, C ו-D וחיברת צלילים לצירופים ולמילים קטנות.
    - אני נותנת לך 5 מטבעות על השלמת תרגולי הבית. עכשיו יש לך בסיס להמשך, ובשיעור הבא נוסיף אות חדשה.
