dialogues:
  the_alphabet_adventure_q01_form_teaching:
    speaker: teacher_maya
    lines:
    - נתחיל באות A.
    - קוראים לה איי.
    - 'לכתוב אותה אפשר בשתי צורות: A גדולה ו-a קטנה.'
    - זאת אותה אות.
    - השם של האות והצליל שהיא מייצגת אינם תמיד אותו הדבר.
  the_alphabet_adventure_q01_apple_teaching:
    speaker: teacher_maya
    lines:
    - Apple פירושו תפוח. A היא אות תנועה. באנגלית אותיות התנועה העיקריות הן A, E, I, O ו-U.
    - אלה אותיות של האלף-בית, והן שונות מסימני הניקוד בעברית.
    - בתחילת apple האות מייצגת את הצליל /æ/. העברית אינה מייצגת את הצליל הזה במדויק, ולכן נקשיב להקלטה באנגלית.
    - האזן למילה השלמה ובחר את האות של הצליל הראשון. אין צורך לקרוא את המילה כולה.
    - יש שתי אפשרויות. את האות שלנו כבר הכרנו; הסימן האחר הוא רק אפשרות נוספת.
  the_alphabet_adventure_q01_acorn_teaching:
    speaker: teacher_maya
    lines:
    - 'A היא אות מיוחדת: היא יכולה לייצג כמה צלילים.'
    - Acorn פירושו בלוט.
    - בתחילת acorn היא מייצגת /eɪ/, כמו בשם האות.
    - Apple ו-acorn מתחילות באותה אות, אף שהצלילים שונים.
    - האזן לשתי הדוגמאות; לא צריך לכתוב אותיות שעוד לא למדת.
    - אל תמתח את הקול כדי ליצור צליל אחר. מדובר בשני צלילים שונים, ולא רק בהבדל באורך.
  the_alphabet_adventure_q01_word_teaching:
    speaker: teacher_maya
    lines:
    - עכשיו צייר את המילה תפוח באנגלית לפי הדוגמה.
    - האותיות האחרות עדיין חדשות, ולכן הן מופיעות בשבילך.
    - הציור עוזר להכיר צורות; הוא לא דורש לקרוא את כל המילה לבד.
  the_alphabet_adventure_q01_finish:
    speaker: Old Man
    lines:
    - תפוח!
    - עכשיו אני נזכר שלקחתי תפוח כשיצאתי מהבקתה.
    - יש ברמז הבא ציור של התיק שלי.
    - אולי הוא יזכיר לי מה קרה אחר כך.
  the_alphabet_adventure_q01_start:
    speaker: Old Man
    lines:
    - בדיוק אותך הייתי צריך.
    - אני אורן, ואני אוהב לספר סיפורים בחגיגות הממלכה.
    - הערב אספר סיפור בחגיגת הממלכה, אבל הספר שלי נעול בתיבה ושכחתי איפה המפתח.
    - כתבתי לעצמי רמזים, וחלק מהאותיות נמחקו.
    - ברמז הראשון מצויר תפוח.
    - תוכל לעזור לי לפענח אותו?
    - גש למאיה כדי ללמוד. את התרגולים תבצע בשולחן הלימוד שבפארק.
  the_alphabet_adventure_q02_form_teaching:
    speaker: teacher_maya
    lines:
    - ברמז הבא מופיע תיק.
    - Bag פירושו תיק.
    - נלמד את B, שנקראת בי.
    - B היא הצורה הגדולה ו-b הקטנה.
    - בתחילת bag האות מייצגת /b/.
    - בחיבור צלילים משתמשים בצליל הזה, ולא בשם בי.
  the_alphabet_adventure_q02_blending:
    speaker: teacher_maya
    lines:
    - אחרי הזיהוי נחבר את הצליל של b לצליל /æ/ של a.
    - /b/ ואז /æ/.
    - זה תרגול של חיבור צלילים, ולא מילה שנדרש לקרוא.
    - בסוף bag יש אות שעוד לא למדנו; היא כבר כתובה.
    - צריך להשלים רק את האות הראשונה.
  the_alphabet_adventure_q02_finish:
    speaker: Old Man
    lines:
    - נכון, לקחתי את התיק.
    - התפוח היה בפנים, אבל שמעתי ממנו רחש מוזר.
    - ברמז הבא מצויר מי שהתחבא בו.
  the_alphabet_adventure_q02_start:
    speaker: Old Man
    lines:
    - ברמז הבא מצויר התיק הישן שלי. הוא היה כבד מהרגיל, וגם השמיע רחש.
    - גש למאיה כדי ללמוד. את התרגולים תבצע בשולחן הלימוד שבפארק. אולי הרמז יזכיר לי מה היה בתיק.
  the_alphabet_adventure_q03_form_teaching:
    speaker: teacher_maya
    lines:
    - ברמז מצויר חתול.
    - Cat פירושו חתול.
    - האות החדשה היא C, שנקראת סי.
    - C גדולה ו-c קטנה הן אותה אות.
    - בתחילת cat היא מייצגת /k/.
    - לאות הזאת יש גם צלילים אחרים, אבל היום נשתמש בדוגמה של החתול.
  the_alphabet_adventure_q03_blending:
    speaker: teacher_maya
    lines:
    - עכשיו נחבר /k/ ואחריו /æ/.
    - חיבור צלילים נעשה לפי הסדר.
    - במילה חתול נשלים רק את האות הראשונה; הסוף כבר כתוב כי עוד לא למדנו את כולו.
    - בתרגול הבא נחזור גם על האות של תיק.
  the_alphabet_adventure_q03_finish:
    speaker: Old Man
    lines:
    - החתול שלי!
    - הוא התחבא בתיק, וכשפתחתי אותו הוא קפץ החוצה.
    - החזקתי את המפתח באותו רגע.
    - הרמז האחרון הוא הכתובת שעל הכרית שקיבלתי מהבת שלי.
  the_alphabet_adventure_q03_start:
    speaker: Old Man
    lines:
    - ברמז הבא מצויר חתול. עכשיו אני מתחיל להבין מאיפה בא הרחש.
    - גש למאיה כדי ללמוד את האות החדשה. את התרגולים תבצע בשולחן הלימוד שבפארק.
  the_alphabet_adventure_q04_form_teaching:
    speaker: teacher_maya
    lines:
    - האות החדשה היא D, שנקראת די.
    - D היא גדולה ו-d קטנה.
    - בתחילת dog, שפירושה כלב, היא מייצגת /d/.
    - השם די שונה מהצליל /d/.
    - 'שים לב: ל-b יש קו גבוה משמאל לבטן, ול-d יש קו גבוה מימין לבטן.'
    - אלה שתי אותיות שונות.
  the_alphabet_adventure_q04_full_words:
    speaker: teacher_maya
    lines:
    - כבר למדנו את כל האותיות של dad.
    - Dad פירושו אבא.
    - נחבר לפי הסדר /d/, /æ/, /d/.
    - יש d גם בתחילת המילה וגם בסופה.
    - 'עכשיו bad: /b/, /æ/, /d/.'
    - Bad פירושו רע.
    - אם נחליף את האות הראשונה, נשנה גם את הצליל הראשון ואת המשמעות.
    - צייר תחילה לפי הדוגמה; אחר כך הקשב והרכב בעצמך.
  the_alphabet_adventure_q04_finish:
    speaker: Old Man
    lines:
    - Dad, אבא!
    - הבת שלי רקמה את המילה על הכרית שלי ליד החלון.
    - כשהחתול קפץ, הנחתי שם את המפתח והרמתי אותו בשתי הידיים.
    - עכשיו נזכרתי איפה לחפש.
    - מצאתי את המפתח ופתחתי את התיבה.
    - הספר בפנים, ובחגיגה אוכל לספר איך עזרת לי.
    - אותיות הן כמו מפתחות קטנים לסיפורים.
    - אני נותן לך 5 מטבעות על העזרה.
    - מאיה הכינה לך עוד שלושה תרגולים קצרים לשיעורי הבית.
  the_alphabet_adventure_q04_start:
    speaker: Old Man
    lines:
    - ברמז האחרון מצוירת הכרית שהבת שלי נתנה לי. היא רקמה עליה הקדשה, אבל האות הראשונה ברמז נמחקה.
    - מאיה תעזור לך לפענח את המילה. נדמה לי שהכרית הזאת תזכיר לי איפה הנחתי את המפתח.
  the_alphabet_adventure_q05_finish:
    speaker: teacher_maya
    lines:
    - סיימת לחזור על שתי הצורות ועל הצלילים בתחילת המילים.
    - אם b ו-d מתבלבלות, עצור ובדוק באיזה צד נמצא הקו הגבוה.
    - בתרגול הבא נחזור לרמזי התפוח והחתול.
  the_alphabet_adventure_q05_start:
    speaker: teacher_maya
    lines:
    - הספר של אורן כבר מוכן לחגיגה.
    - לפני השיעור הבא נחזק שתי אותיות שקל לבלבל.
    - ב-b הקו הגבוה נמצא משמאל לבטן, וב-d הוא נמצא מימין.
    - צייר אותן, ואז האזן לכל מילה ובחר לפי הצליל הראשון.
    - הפעם נעבוד עם כל ארבע האותיות שלמדנו.
    - הכול מחכה לך בשולחן הלימוד בפארק.
  the_alphabet_adventure_q06_finish:
    speaker: teacher_maya
    lines:
    - חזרת אל האותיות בסדר חדש.
    - ב-apple וב-acorn בחרת אותה אות, למרות הצלילים השונים בתחילתן.
    - בשיעורים הבאים נלמד עוד דוגמאות שיעזרו לבחור את הצליל לפי המילה.
  the_alphabet_adventure_q06_start:
    speaker: teacher_maya
    lines:
    - אורן רוצה להציג בחגיגה את הרמזים שפתרת.
    - הפעם הם מופיעים בסדר אחר.
    - הקשב לכל מילה ובחר רק את האות של הצליל הראשון.
    - אינך צריך לקרוא את המילה כולה.
    - אותה אות יכולה להתאים למילים עם צלילי פתיחה שונים, כמו בשתי הדוגמאות של A.
  the_alphabet_adventure_q07_finish:
    speaker: teacher_maya
    lines:
    - סיימת את ההרפתקה ואת שלושת תרגולי הבית.
    - הכרת את A, B, C ו-D, חזרת על הצורות שלהן וחיברת את הצלילים במילים קטנות.
    - אני נותנת לך 5 מטבעות על השלמת תרגולי הבית.
    - עכשיו יש לך בסיס להמשך, ובשיעור הבא נוסיף אות חדשה.
  the_alphabet_adventure_q07_start:
    speaker: teacher_maya
    lines:
    - לסיום נכין שתי מילים קטנות שכבר למדנו.
    - Dad פירושו אבא, ו-bad פירושו רע.
    - שתי האותיות האחרונות זהות, והאות הראשונה משנה את המילה.
    - עכשיו נסה להרכיב לפי המשמעות ואחר כך לפי ההקלטה.
    - במשחק האחרון נחזור על מילה מוכרת בתנועה.
    - כשמעשה הוא רע, אפשר לתקן אותו. טעות בתרגול היא חלק מהלמידה.
