# Personal Pronouns homework - rehearsal before the next village show.
# Homework teaches nothing new: no rule before practice, a short rule reminder at the end.
# Hebrew-first, short blocks. No quotation marks inside dialogue text. No em dash.
dialogues:

  personal_pronouns_homework_q01_start:
    speaker: Village Head
    lines:
      - "ההצגה הייתה הצלחה גדולה, וכל הכפר מבקש הצגה נוספת."
      - "לפני שכותבים אותה, אני רוצה לבדוק שהלהקה זוכרת את כל כינויי הגוף."
      - "היום אין מילים חדשות. תראו לי לבד מה אתם כבר יודעים. הכול מחכה לכם על השולחן בפארק."

  personal_pronouns_homework_q01_finish:
    speaker: Village Head
    lines:
      - "מצוין. עם מילים כאלה גם ההצגה הבאה תיכנס בדף אחד."
      - "זכרו: He = הוא, על בן. She = היא, על בת. It = זה, על חפץ או על בעל חיים."
      - "We = אנחנו, אני ועוד אנשים. They = הם או הן, על אנשים אחרים."
      - "כל הכבוד. עשיתם את שיעורי הבית לבד."
