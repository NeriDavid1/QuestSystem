# Personal Pronouns - The Village Play. Two NPCs only, both in FairyRosePark.
# Hebrew-first, short blocks. No quotation marks inside dialogue text. No em dash.
dialogues:
  personal_pronouns_q01_start:
    speaker: Village Head
    lines:
      - "מחר בערב יש הצגה בפארק, וכל הכפר מגיע. יש רק בעיה אחת."
      - "הילד הקטן כתב את כל המחזה לבד, אבל הוא כתב כל שם שוב ושוב: Dan is here. Dan is happy. Dan is the king."
      - "הדפים במחברת נגמרו באמצע, וסוף ההצגה עוד לא כתוב."
      - "יש פתרון. כינוי גוף = pronoun. זו מילה קצרה שבאה במקום שם. במקום Dan is the king אפשר לכתוב He is the king."
      - "נתחיל בשתי מילים. I = אני, כשמדברים על עצמי. You = אתה או את, כשמדברים אל מישהו."
      - "בואו נכתוב מחדש את התמונה הראשונה."
  personal_pronouns_q01_finish:
    speaker: Village Head
    lines:
      - "התמונה הראשונה נכנסת עכשיו בחצי דף. זה עובד."
      - "לכו אל הילד הקטן, הוא יושב ליד השולחן עם המחברת. תראו לו מה למדנו."

  personal_pronouns_q02_start:
    speaker: Little Boy
    lines:
      - "כתבתי את ההצגה לבד, ואף שחקן לא מצליח לקרוא אותה."
      - "בתמונה השנייה יש זמר ורקדנית, ואני כתבתי את השמות שלהם שבע עשרה פעמים."
      - "ראש הכפר אמר שיש מילה קצרה לבן ומילה קצרה לבת."
      - "He = הוא, על בן. She = היא, על בת."
      - "בואו נכתוב את התמונה השנייה יחד."
  personal_pronouns_q02_finish:
    speaker: Little Boy
    lines:
      - "מדהים. עכשיו כל התמונה השנייה נכנסת בדף אחד, ועוד נשאר לי מקום."
      - "ראש הכפר מסדר עכשיו את האביזרים של ההצגה. לכו אליו, הוא נתקע עם הרשימה."

  personal_pronouns_q03_start:
    speaker: Village Head
    lines:
      - "יש לי כאן ארגז אביזרים: כובע, כתר ומטריה. לאף אחד מהם אין שם."
      - "It = זה. משתמשים במילה הזאת על חפץ או על בעל חיים, אף פעם לא על אדם."
      - "ויש עוד מילה שאני צריך. We = אנחנו, כשאני מדבר על עצמי ועל כל הלהקה יחד."
      - "בואו נסדר את הרשימה לפני החזרה האחרונה."
  personal_pronouns_q03_finish:
    speaker: Village Head
    lines:
      - "הרשימה מוכנה וכל האביזרים בארגז. תודה לכם."
      - "נשארה התמונה האחרונה, זו עם הקהל הגדול. הילד הקטן נתקע בה מאתמול. לכו אליו."

  personal_pronouns_q04_start:
    speaker: Little Boy
    lines:
      - "בתמונה האחרונה עומדים עשרים אנשים על הבמה, ואני לא יכול לכתוב עשרים שמות."
      - "כשמדברים על יותר מאדם אחד יש מילה אחת שמספיקה לכולם."
      - "They = הם או הן. לא משנה אם אלה בנים או בנות, המילה נשארת אותו דבר."
      - "בואו נסיים את המחזה."
  personal_pronouns_q04_finish:
    speaker: Little Boy
    lines:
      - "כתבתי את המילה האחרונה, ונשארו לי שני דפים ריקים. סיימנו את המחזה!"
      - "ראש הכפר כבר מדליק את הפנסים על הבמה. הערב מתחילה ההצגה."

  personal_pronouns_q05_start:
    speaker: Village Head
    lines:
      - "הקהל יושב, הפנסים דולקים, וההצגה מתחילה בעוד רגע."
      - "בתמונה הזאת כל המילים מעורבבות: I, You, He, She, It, We, They."
      - "הפעם תרכיבו את המשפטים לבד, בלי עזרה, ואז תגידו את השורות שלכם בקול על הבמה."
  personal_pronouns_q05_finish:
    speaker: Village Head
    lines:
      - "ההצגה נגמרה והקהל עמד ומחא כפיים. הילד הקטן לא מפסיק לחייך."
      - "כל המחזה נכנס למחברת אחת, כי ידעתם להחליף כל שם במילה הקצרה הנכונה."
      - "קבלו עשרה מטבעות עכשיו. סיימתם את הסיפור בהצלחה!"
