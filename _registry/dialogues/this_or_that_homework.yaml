# This Or That? homework - the new Knowledge Advisors get ready to guide guests who speak only English.
# Epilogue after the Village Head's advisors test (line_thisorthat q03): the title now has a first real job.
# Homework teaches nothing new: no rule before practice, a short rule reminder at the end.
# Hebrew-first, short blocks. No quotation marks inside dialogue text. No em dash.
dialogues:

  this_or_that_homework_q01_start:
    speaker: Village Head
    lines:
      - "יועצי הידע שלי, חזרתם! מחר מגיעים לעיירה אורחים מארץ רחוקה, והם מדברים רק אנגלית."
      - "אתם תהיו המדריכים שלהם. תראו להם את העיירה ותמסרו להם את מכתב הברכה שלי."
      - "היום אין מילים חדשות. אני רק רוצה לראות שאתם יודעים להצביע נכון באנגלית, בלי עזרה."
      - "שולחן המבחנים בפארק כבר מחכה לכם."

  this_or_that_homework_q01_finish:
    speaker: Village Head
    lines:
      - "מושלם! מחר תמסרו לאורחים את המכתב, והם יבינו כל דבר שתראו להם."
      - "זכרו: this = הזה או הזאת, that = ההוא או ההיא, these = האלה, those = ההם. וכשלא מצביעים, the = ה' הידיעה."
      - "כל הכבוד, יועצי הידע. עשיתם את שיעורי הבית לבד."
