# Local dialogue scripts for The Kingdom's Worst Day.
dialogues:
  the_kingdoms_worst_day_q01_fenn_start:
    speaker: City Gaurd Info
    lines:
      - 'היום נפתח היריד לילדים ליד שער הממלכה.'
      - 'הגיעו לשם כמה דברים, אבל השמות שלהם נמחקו מהפתקים.'
      - 'שם עצם הוא מילה שנותנת שם לאדם, לחיה, למקום או לדבר.'
      - 'עזרו לי לזהות את הדברים, כדי שאוכל להכין את היריד.'
  the_kingdoms_worst_day_q01_fenn_done:
    speaker: City Gaurd Info
    lines:
      - 'מצוין. עכשיו ברור אילו דברים הגיעו ליריד.'
      - 'ויל Blacksmith מכין את הדוכן, אבל ההוראות שלו כבר לא ברורות.'
      - 'לכו אליו ותשאלו איך אפשר לעזור לו.'
  the_kingdoms_worst_day_q02_will_start:
    speaker: Blacksmith
    lines:
      - 'אני בונה את הדוכן, אבל פתקי העבודה התבלבלו.'
      - 'פועל הוא מילה שמספרת מה מישהו עושה.'
      - 'עזרו לי להבין את הפעולות, כדי שאספיק לסיים בזמן.'
  the_kingdoms_worst_day_q02_will_done:
    speaker: Blacksmith
    lines:
      - 'תודה. עכשיו אני יודע איך להמשיך בבנייה.'
      - 'הציירת Painter מכינה את השלטים ליריד, אבל קשה לה לתאר אותם.'
      - 'לכו אליה ותשאלו איך אפשר לעזור לה.'
  the_kingdoms_worst_day_q03_painter_start:
    speaker: Painter
    lines:
      - 'אני מכינה שלטים צבעוניים ליריד.'
      - 'שם תואר הוא מילה שמתארת אדם, חיה, מקום או דבר.'
      - 'עזרו לי לבחור תיאורים ברורים, כדי שהילדים ימצאו כל דוכן.'
  the_kingdoms_worst_day_q03_painter_done:
    speaker: Painter
    lines:
      - 'נהדר. עכשיו השלטים ברורים וקל להבין אותם.'
      - 'פרופסור קרייזי Professor Crazy מכין את ההודעה שתשמע בתחילת היריד.'
      - 'לכו אליו ועזרו לו להכין אותה.'
  the_kingdoms_worst_day_q04_professor_start:
    speaker: Professor Crazy
    lines:
      - 'אני מכין הודעה לאורחים, אבל המילים התערבבו.'
      - 'הודעה ברורה צריכה שמות של דברים, פעולות ותיאורים.'
      - 'עזרו לי לסדר אותה, כדי שכל הילדים יבינו לאן ללכת.'
  the_kingdoms_worst_day_q04_professor_done:
    speaker: Professor Crazy
    lines:
      - 'ההודעה מוכנה. עכשיו כולם יוכלו להבין אותה.'
      - 'מדריך ההרים Mountain Guide יעביר אותה בקול לאורחים שבדרך.'
      - 'לכו אליו כדי שהיריד יוכל להתחיל.'
  the_kingdoms_worst_day_q04_guide_start:
    speaker: Mountain Guide
    lines:
      - 'האורחים כבר מתקרבים, והם מחכים להודעה.'
      - 'נעביר אותה בקול ברור, כדי שכולם יידעו שהיריד פתוח.'
      - 'אחר כך חזרו אל המורה מאיה Teacher Maya וספרו לה שהכול מוכן.'
  the_kingdoms_worst_day_q04_maya_done:
    speaker: teacher_maya
    lines:
      - 'עשיתם עבודה נהדרת. היריד יכול להתחיל.'
      - 'שמות, פעולות ותיאורים עזרו לכולם להבין את ההודעה.'
      - 'Words make sentences, and sentences help people understand.'
      - 'מילים יוצרות משפטים, ומשפטים עוזרים לאנשים להבין.'
      - 'כל הכבוד! הנה 50 מטבעות בשבילכם.'
