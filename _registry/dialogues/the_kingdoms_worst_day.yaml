# Local dialogue scripts for The Kingdom's Worst Day.
dialogues:
  the_kingdoms_worst_day_q01_fenn_start:
    speaker: City Gaurd Info
    lines:
      - 'אוי לא. המילים ברשימת השער נעלמו.'
      - 'שם עצם הוא שם של אדם, חיה, מקום או דבר.'
      - 'בואו נעזור לי להבין את הרשימה ולשמור על השער.'
  the_kingdoms_worst_day_q01_fenn_done:
    speaker: City Gaurd Info
    lines:
      - 'מצוין. עכשיו הרשימה שוב מובנת.'
      - 'גם ויל מצא מילים חסרות בפתקי העבודה שלו.'
      - 'לכו אליו ושמעו איך אפשר לעזור.'
  the_kingdoms_worst_day_q02_will_start:
    speaker: Blacksmith
    lines:
      - 'הכלים שלי כאן, אבל פתקי העבודה לא ברורים.'
      - 'פועל הוא מילה שמספרת מה מישהו עושה.'
      - 'בואו נעזור לי להבין את הפתקים, כדי שאוכל לחזור לעבוד.'
  the_kingdoms_worst_day_q02_will_done:
    speaker: Blacksmith
    lines:
      - 'עבודה טובה. עכשיו אני שוב מבין מה לעשות.'
      - 'גם הציירת צריכה עזרה עם הציורים שלה.'
      - 'לכו אליה ושמעו מה חסר לה.'
  the_kingdoms_worst_day_q03_painter_start:
    speaker: Painter
    lines:
      - 'אוי לא. הציורים שלי איבדו את התיאורים שלהם.'
      - 'שם תואר הוא מילה שמתארת אדם, חיה, מקום או דבר.'
      - 'בואו נעזור לי להבין איזה תיאור מתאים לכל ציור.'
  the_kingdoms_worst_day_q03_painter_done:
    speaker: Painter
    lines:
      - 'נהדר. עכשיו אפשר להבין מה רואים בכל ציור.'
      - 'פרופסור קרייזי מנסה להכין הודעה חשובה לממלכה.'
      - 'לכו אליו ושמעו אם תוכלו לעזור לו.'
  the_kingdoms_worst_day_q04_professor_start:
    speaker: Professor Crazy
    lines:
      - 'המכונה שלי הכינה הודעה, אבל המילים התערבבו.'
      - 'כדי שההודעה תהיה ברורה, צריך שמות, פעולות ותיאורים.'
      - 'בואו נעזור לי להכין את ההודעה לממלכה.'
  the_kingdoms_worst_day_q04_professor_done:
    speaker: Professor Crazy
    lines:
      - 'ההודעה ברורה עכשיו, והמכונה שוב עובדת.'
      - 'מדריך ההרים יכול להעביר אותה לכל הממלכה.'
      - 'לכו אליו כדי שההודעה תישמע.'
  the_kingdoms_worst_day_q04_guide_start:
    speaker: Mountain Guide
    lines:
      - 'ההודעה הגיעה אליי. עכשיו חשוב להעביר אותה בקול ברור.'
      - 'נעשה זאת יחד, כדי שכל מי שנמצא בממלכה יוכל לשמוע.'
      - 'אחר כך חזרו אל Teacher Maya וספרו לה איך עבר היום.'
  the_kingdoms_worst_day_q04_maya_done:
    speaker: teacher_maya
    lines:
      - 'הצלחתם לעזור לממלכה ביום הקשה הזה.'
      - 'שמות, פעולות ותיאורים עזרו לכולם להבין את ההודעה.'
      - 'Words make sentences, and sentences make the kingdom work.'
      - 'מילים יוצרות משפטים, ומשפטים עוזרים לכולם להבין.'
      - 'כל הכבוד! קבלו 10 מטבעות על ההצלה.'
