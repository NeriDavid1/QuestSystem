# Dialogue scripts exported from Unity — abc_valley
dialogues:
  intro1_wake:
    speaker: grandpa_tobias
    lines:
      - חררר... מה? מי שם?! אה! סליחה, רק עצמתי את העיניים לרגע.
  intro1_turnin:
    speaker: grandpa_tobias
    lines:
      - שמעת? הבאר ענתה לך! היא לא עונה לכל אחד.
  intro2_mira:
    speaker: mira_stonecarver
    lines:
      - שלום! אתה החדש? בוא, תתקרב. העיניים שלי כבר לא משהו, אבל הידיים שלי זוכרות
        הכול.
  intro2_pip:
    speaker: pip_bellringer
    lines:
      - היי! כאן! שמעת את הפעמון? דונג... ככה הוא נשמע היום. עמום ועצוב.
  intro2_bruno:
    speaker: bruno_gardener
    lines:
      - אה, שלום לך! סליחה, לא שמתי לב שבאת. הנה, קח תפוח. טרי מהעץ!
  intro2_noa:
    speaker: noa
    lines:
      - בו! נבהלת? חה! אני נועה. ראיתי אותך מסתובב פה כל היום.
  intro2_turnin:
    speaker: grandpa_tobias
    lines:
      - נו, הכרת את כולם? מירה שכמעט לא רואה, פיפ והפעמון שאיבד את הצלילים, ברונו
        והזרעים הישנים...
  intro3_story:
    speaker: grandpa_tobias
    lines:
      - תקשיבו כולם. הגיע הזמן שתדעו את האמת.
  intro3_turnin:
    speaker: grandpa_tobias
    lines:
      - זה היה הוא. הקוסם האפל. הוא חזר.
  a_lesson:
    speaker: grandpa_tobias
    lines:
      - לפני שאתה יוצא, תסתכל על ההר שלנו. שני צדדים שנפגשים בפסגה, ושביל באמצע. ככה
        נראית A.
  a_turnin:
    speaker: grandpa_tobias
    lines:
      - כל הרסיסים! וניצחת את המימיק? טוב, הוא היה קטן. אבל כשהייתי צעיר, הייתי בורח
        גם מקטן.
  b_lesson:
    speaker: bruno_gardener
    lines:
      - 'אתה יודע איזו אות אני הכי אוהב? B. היא נראית כמו אני אחרי ארוחה: קו ישר ושתי
        בטנים!'
  b_turnin:
    speaker: bruno_gardener
    lines:
      - ראית את הגבעול? עד השמיים! אף פעם לא גידלתי משהו כזה!
  c_lesson:
    speaker: noa
    lines:
      - שמעת? "ק... ק...". זה מגיע מהמערה.
  c_turnin:
    speaker: noa
    lines:
      - עשינו את זה! הייתי בפנים! ממש בפנים!
  fun1_alarm:
    speaker: grandpa_tobias
    lines:
      - שמעת את הרעש הזה? משהו מגיע מהקניון!
  fun1_turnin:
    speaker: grandpa_tobias
    lines:
      - הם ברחו! ראית איך רצו?
  d_lesson:
    speaker: pip_bellringer
    lines:
      - הסבא שלי הטמין ליד הבריכה תוף זהב, והמפה שלו סימנה אותו באיקס. אבל הקוסם פיזר
        בלילה עוד המון איקסים!
  d_turnin:
    speaker: pip_bellringer
    lines:
      - התוף של סבא שלי! יודע כמה שנים חיפשתי אותו?
  hw1_letters:
    speaker: grandpa_tobias
    lines:
      - בוקר טוב! הגיעו ארבעה מכתבים, אחד לכל אות שהדלקת.
  hw1_turnin:
    speaker: grandpa_tobias
    lines:
      - כל המכתבים הגיעו? A, B, C, D... אתה כבר יודע ארבע אותיות!
  e_lesson:
    speaker: grandpa_tobias
    lines:
      - הרוח של הקוסם פיזרה את כל הביצים שלי בעמק! אם הן לא יחזרו לחום של הלול, האפרוחים
        שבתוכן יתקררו.
  e_turnin:
    speaker: grandpa_tobias
    lines:
      - כל האפרוחים! תראה איך הם הולכים אחריך בשורה, כאילו אתה אמא שלהם.
  f_lesson:
    speaker: mira_stonecarver
    lines:
      - ראית? האבנים המרחפות נופלות עם שובל זהב. הן חלקים של אבן העמידה הגדולה!
  f_turnin:
    speaker: mira_stonecarver
    lines:
      - תן לי להרגיש... הקו הזה, ועוד אחד, ועוד אחד. F, כמו fire.
  g_lesson:
    speaker: grandpa_tobias
    lines:
      - סבא טוביאס, מה הסימן על העץ?
  g_turnin:
    speaker: grandpa_tobias
    lines:
      - ענק! היה ענק בכיכר שלנו!
  fun2_bet:
    speaker: noa
    lines:
      - תגיד, אתה חושב שאתה יכול לטפס עד הרכס? עד האותיות עצמן?
  fun2_turnin:
    speaker: noa
    lines:
      - חה! הגעתי ראשונה! אבל גם אתה הגעת. כל הכבוד.
  h_lesson:
    speaker: pip_bellringer
    lines:
      - תסתכל על המפל! המים זורמים למעלה! והבריכה מלאה אותיות מבולבלות.
  h_turnin:
    speaker: pip_bellringer
    lines:
      - המים חזרו לרדת! אני כל כך רטובה.
  hw2_open:
    speaker: bruno_gardener
    lines:
      - ברוך הבא לדוכן של ברונו! הכפר מזמין, ואנחנו מוכרים.
  hw2_turnin:
    speaker: bruno_gardener
    lines:
      - כל ההזמנות נמסרו! אתה המוכר הכי טוב שהיה לי. בעצם, הראשון.
  i_lesson:
    speaker: pip_bellringer
    lines:
      - קום! קום! כל העמק קפוא! ומירה... מירה תקועה בתוך גוש קרח!
  i_turnin:
    speaker: mira_stonecarver
    lines:
      - ברררר... כמה זמן הייתי שם?
  j_lesson:
    speaker: bruno_gardener
    lines:
      - הצנצנות שלי! הקוסם כישף אותן, והן קפצו מהמדף! ואני צריך אותן לפסטיבל הריבה!
  j_turnin:
    speaker: bruno_gardener
    lines:
      - כל הצנצנות! גם זאת עם הריבה של סבתא!
  k_lesson:
    speaker: pip_bellringer
    lines:
      - הקוסם נעל את שלושת הבתים! והמפתחות מוסתרים בתיבות בכפר.
  k_turnin:
    speaker: pip_bellringer
    lines:
      - הדלת שלי נפתחה! והעפיפון שלך... עוד בשמיים?
  fun3_stones:
    speaker: mira_stonecarver
    lines:
      - הרגשתי את האבנים המרחפות. הן יציבות עכשיו. הן יכולות להחזיק ילד!
  fun3_turnin:
    speaker: mira_stonecarver
    lines:
      - ידעתי שהאבנים יחזיקו. הרגשתי את זה.
  l_lesson:
    speaker: noa
    lines:
      - 'הקוסם גנב את כל האור של הלילה, והגחליליות ברחו. יש לי רעיון: נתפוס אותן בצנצנות!'
  l_turnin:
    speaker: noa
    lines:
      - פעם פחדתי מהחושך. עכשיו... קצת פחות.
  hw3_plan:
    speaker: pip_bellringer
    lines:
      - 'שמעת? לפעמון חזרו ארבעה צלילים! תליתי במגדל ארבעה פעמונים קטנים: I, J, K,
        L.'
  hw3_turnin:
    speaker: pip_bellringer
    lines:
      - שמעת את הכפר מוחא כפיים? זה בשבילנו!
  m_lesson:
    speaker: grandpa_tobias
    lines:
      - אני מתחיל להיזכר בימים שבהם האותיות זהרו. אבל הכול מטושטש...
  m_turnin:
    speaker: grandpa_tobias
    lines:
      - פסל, צלילים, ציור... כן. כן! נזכרתי.
  n_lesson:
    speaker: bruno_gardener
    lines:
      - אחרי כל ההרפתקאות מגיעה לכפר ארוחה! אבל הקוסם כישף את המטבח, וכל המצרכים ברחו
        לכל הכפר.
  n_turnin:
    speaker: bruno_gardener
    lines:
      - עוד צלחת? כמובן! N כמו noodles, ו-N כמו never enough noodles.
  o_call:
    speaker: grandpa_tobias
    lines:
      - חזרתי עכשיו מהקניון. מישהו ענק יושב באמצע השביל!
  o_lesson:
    speaker: grandpa_tobias
    lines:
      - אורקים אוהבים חידות. מי שעונה עליהן, עובר.
  o_turnin:
    speaker: grandpa_tobias
    lines:
      - ראית? לא צריך תמיד חרב. לפעמים צריך רק לשאול את השאלה הנכונה.
  fun4_ponies:
    speaker: bruno_gardener
    lines:
      - תראה מי חזרו! הפונים הישנים של העמק. הם אוכלים לי את כל הגזר.
  fun4_turnin:
    speaker: bruno_gardener
    lines:
      - ראית את הטבעת האחרונה? הפוני שלך עף!
  p_lesson:
    speaker: mira_stonecarver
    lines:
      - הפסיפס שלי! בניתי אותו לפני שנים, ובו ציור של כל העמק. והבוקר הוא אפור לגמרי.
        הקוסם שאב ממנו את כל הצבעים.
  p_turnin:
    speaker: mira_stonecarver
    lines:
      - אני לא רואה טוב את הצבעים. אבל אני מרגישה אותם. האבנים חמות שוב.
  hw4_penalty:
    speaker: noa
    lines:
      - האורק משתעמם! הוא יושב ליד הבריכה כל היום ונאנח.
  hw4_turnin:
    speaker: noa
    lines:
      - ארבעה גולים! הוא לא עצר אף אחד!
  q_lesson:
    speaker: pip_bellringer
    lines:
      - הקוסם גנב מהפעמון את הצלילים שחזרו, ופיזר אותם כהדים בכל העמק!
  q_museum:
    speaker: pip_bellringer
    lines:
      - מצאת ארבעה הדים! אבל את הצליל האחרון, "קוו", הקוסם החביא עמוק מדי.
  q_turnin:
    speaker: pip_bellringer
    lines:
      - שקט... ועכשיו...
  r_call:
    speaker: mira_stonecarver
    lines:
      - זוכר את ה-R הענקית ששוכבת שבורה בשביל, לפני הכניסה לקניון? הקוסם הפיל אותה
        מהשמיים ביום השקט.
  r_lesson:
    speaker: mira_stonecarver
    lines:
      - תעביר יד על האות הגדולה. מרגיש? זו P עם רגל לעמוד עליה. זו R.
  r_turnin:
    speaker: mira_stonecarver
    lines:
      - היא הייתה כבדה יותר ממה שחשבתי, אבל עפה כמו נוצה.
  s_lesson:
    speaker: noa
    lines:
      - 'השמש לא זורחת! הקוסם הטיל כישוף: בעמק יהיה רק לילה, לתמיד.'
  s_turnin:
    speaker: noa
    lines:
      - תראה! השמש! היא זכרה את הדרך!
  fun5_sleds:
    speaker: noa
    lines:
      - תראה מה מצאתי מתחת לשלג! מזחלות עץ ישנות!
  fun5_turnin:
    speaker: noa
    lines:
      - רימית! עקפת אותי בקפיצה הזאת!
  t_lesson:
    speaker: bruno_gardener
    lines:
      - תראה מה מצאתי במחסן! תוכנית ישנה ומקומטת. פעם היה בית עץ, tree house, בעץ
        הגדול הזה.
  t_turnin:
    speaker: bruno_gardener
    lines:
      - בית עץ! בית עץ אמיתי! ורואים ממנו את כל העמק!
  hw5_album:
    speaker: noa
    lines:
      - אני מכינה אלבום של כל ההרפתקאות שלנו! אבל בכל עמוד חסרה תמונה.
  hw5_turnin:
    speaker: noa
    lines:
      - האלבום מלא! תראה, זה אתה עם החבל. וזאת המדורה הגדולה על ההר.
  u_lesson:
    speaker: mira_stonecarver
    lines:
      - אתה מרגיש? משהו רועד מתחת לבאר. גיליתי מדרגות נסתרות!
  u_turnin:
    speaker: mira_stonecarver
    lines:
      - הוא גר כאן. מתחת לרגליים שלנו. הקוסם.
  v_lesson:
    speaker: noa
    lines:
      - (בלחש) תסתכל על הגמד הזה. הוא הגיע הבוקר עם van, עגלה גדולה, ומחלק לכולם מתנות
        בחינם.
  v_turnin:
    speaker: noa
    lines:
      - ידעתי! ידעתי שגמדים לא זוהרים!
  w_lesson:
    speaker: grandpa_tobias
    lines:
      - בלילה הקוסם בנה חומה שחורה באמצע העמק. חצי מהכפר בצד אחד, וחצי בצד השני.
  w_turnin:
    speaker: grandpa_tobias
    lines:
      - הוא ניסה לחלק אותנו. זה מה שהוא תמיד רצה, שכל אחד יהיה לבד.
  fun6_plan:
    speaker: noa
    lines:
      - יום חופש! אין קוסם, אין אותיות, רק כיף.
  fun6_turnin:
    speaker: noa
    lines:
      - מצאת אותי בכל פעם. זה לא הוגן!
  x_lesson:
    speaker: mira_stonecarver
    lines:
      - הר שלם של קופסאות! box, box, box! מי שם אותו באמצע הכיכר?
  x_turnin:
    speaker: mira_stonecarver
    lines:
      - ראית את הראש של הקוסם על הקפיץ? "בּוּ!" לא פחדתי. כמעט.
  hw6_quiz:
    speaker: grandpa_tobias
    lines:
      - חידון! ליד הבאר. אני אומר מילה, ואתה בוחר באיזו אות היא מתחילה.
  hw6_turnin:
    speaker: grandpa_tobias
    lines:
      - כל התשובות נכונות! הבאר לא הפסיקה לענות.
  y_lesson:
    speaker: grandpa_tobias
    lines:
      - כמעט נזכרתי בכל יום השקט. חסר לי רק החלק האחרון.
  y_story:
    speaker: grandpa_tobias
    lines:
      - שב לידי. עכשיו אני זוכר הכול.
  y_turnin:
    speaker: grandpa_tobias
    lines:
      - עכשיו אני מבין למה הוא ברח. אף אחד לא עזר לו, וגם אני לא.
  z_lesson:
    speaker: noa
    lines:
      - (מפהקת) זזזז... מה קרה? כולם נוחרים!
  z_turnin:
    speaker: noa
    lines:
      - (מרחוק, מעבר לקשת) זה לא נגמר! יש עוד ממלכה שלמה!
  grad_call:
    speaker: grandpa_tobias
    lines:
      - שמעת? כל העמק מתאסף בכיכר. היום חוגגים אותך.
  grad_page:
    speaker: grandpa_tobias
    lines:
      - יש לי עוד דבר אחד בשבילך. דף ישן.
  grad_turnin:
    speaker: grandpa_tobias
    lines:
      - באת לכאן תלמיד חדש. אתה יוצא... עדיין תלמיד. ככה זה אמור להיות.
