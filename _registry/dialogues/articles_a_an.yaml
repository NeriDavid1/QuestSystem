# A / An - Nemo the Netless and the twin fish A and AN.
# Hebrew-first, short blocks. No quotation marks inside dialogue text. No em dash.
dialogues:

  articles_a_an_q01_start:
    speaker: Fisherman
    lines:
      - "שלום. אני נמו Nemo, הדייג של המפרץ. כולם פה קוראים לי נמו בלי הרשת."
      - "הבוקר עוד רשת שלי נקרעה. זאת כבר הרשת השלישית השבוע."
      - "הרשתות שלי מיוחדות. הן מחזיקות מילים באנגלית, ובמיוחד מילה אחת קטנה מאוד."
      - "a = אחד או אחת. שמים אותה לפני שם של דבר אחד. a cat = חתול אחד, a dog = כלב אחד."
      - "התיבה ליד המים מלאה במילים של הים. בואו נתחיל משם."

  articles_a_an_q01_finish:
    speaker: Fisherman
    lines:
      - "יפה מאוד. כשאומרים את a נכון, הרשת מחזיקה חזק."
      - "אבל לפעמים היא נקרעת. אספר לכם סוד שעוד לא סיפרתי לאף אחד."
      - "כשהייתי ילד נפלתי מהסירה של אבא שלי בסערה, ומלכת הים הצילה אותי."
      - "בתמורה הבטחתי לה לשמור על שני דגים קטנים ותאומים. אחד מהם ברח בסערה האחרונה."
      - "תחזרו אליי, ונחפש אותו יחד."

  articles_a_an_q02_start:
    speaker: Fisherman
    lines:
      - "לתאומים קוראים A ו־AN. ל־AN יש זנב נוסף, האות n."
      - "באנגלית יש חמש אותיות ניקוד: a, e, i, o, u. אות ניקוד = vowel."
      - "כשהמילה הבאה מתחילה באות ניקוד, שמים an במקום a."
      - "an ant = נמלה אחת, an owl = ינשוף אחד."

  articles_a_an_q02_finish:
    speaker: Fisherman
    lines:
      - "מצאתם את AN. כבר שנים לא ראיתי אותו שוחה ככה."
      - "אבל הסערה האחרונה בלבלה את כל המפרץ. בואו נבדוק מה קרה בשוק."

  articles_a_an_q03_start:
    speaker: Fisherman
    lines:
      - "תראו את השלטים בשוק. מישהו כתב אותם בזמן הסערה, והכול התבלבל."
      - "ליד הדגים כתוב an, וליד הביצים כתוב a. בגלל שלטים כאלה הרשת שלי נקרעת."
      - "הסוד פשוט: מסתכלים על האות הראשונה של המילה שבאה אחרי."
      - "בואו נסדר את השלטים מחדש."

  articles_a_an_q03_finish:
    speaker: Fisherman
    lines:
      - "עכשיו השוק נראה כמו שצריך, והתאומים שוחים בשקט."
      - "רגע, מה זה על החוף? בקבוק עם מכתב בפנים. תחזרו אליי ונפתח אותו יחד."

  articles_a_an_q04_start:
    speaker: Fisherman
    lines:
      - "המכתב הזה ממלכת הים. אני מכיר את כתב היד שלה."
      - "המים מחקו ממנו את המילים הקטנות, ובלי a ו־an אי אפשר להבין מה היא רוצה."
      - "בואו נבנה מחדש את המשפטים שלה."

  articles_a_an_q04_finish:
    speaker: Fisherman
    lines:
      - "עכשיו אפשר לקרוא הכול. מלכת הים כותבת שהתאומים מחכים ליד הסלעים."
      - "והיא מזהירה שמילת תיאור יכולה לבלבל אותם. תחזרו אליי, ונלך לבדוק."

  articles_a_an_q05_start:
    speaker: Fisherman
    lines:
      - "הנה הסלעים. התאומים כאן, אבל הם שוב מבולבלים."
      - "זוכרים את מילות התיאור? big = גדול, old = ישן, small = קטן."
      - "לפעמים מילת תיאור נכנסת בין a או an לבין השם של הדבר."
      - "הכלל החשוב: רק המילה שבאה מיד אחרי a או an מחליטה, לא המילה שבסוף."
      - "an ant = נמלה, אבל a big ant = נמלה גדולה."

  articles_a_an_q05_finish:
    speaker: Fisherman
    lines:
      - "התאומים שוחים שוב זה ליד זה. עכשיו הם יודעים מי הולך לפני כל מילה."
      - "מחר נארוג יחד רשת חדשה. תחזרו אליי."

  articles_a_an_q06_start:
    speaker: Fisherman
    lines:
      - "הגיע הזמן. היום אני אורג את הרשת שמלכת הים ביקשה ממני לפני הרבה שנים."
      - "כל משפט נכון הוא קשר חזק ברשת. משפט עם טעות הוא חור."
      - "בסוף מלכת הים תשלח לנו את אבן החן שלה, והיא תחזיק את הרשת לתמיד."

  articles_a_an_q06_finish:
    speaker: Fisherman
    lines:
      - "תראו. קשרתי את אבן החן לרשת, והיא לא נקרעת."
      - "מהיום אני כבר לא נמו בלי הרשת. אני נמו של הרשת."
      - "קחו את המטבעות האלה כתודה. בזכותכם התאומים A ו־AN חזרו הביתה."
