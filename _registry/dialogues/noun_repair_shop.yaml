# Dialogue scripts for Noun Repair Shop: The Missing Names.
dialogues:
  noun_repair_q01_start:
    speaker: teacher_maya
    lines:
      - "אוי לא. בספר המילים שלי חסרים שמות."
      - "Noun הוא שם של אדם, חיה, מקום או דבר."
      - "למשל, boy, cat, park ו table הם nouns."
      - "בלי השמות האלה קשה להבין מה רואים בתמונה."
      - "בואו נחזיר לספר את השמות שנעלמו."
  noun_repair_q01_finish:
    speaker: teacher_maya
    lines:
      - "תודה! עכשיו הספר כבר הרבה יותר ברור."
      - "אפשר לזהות בו אנשים, חפצים, מקומות וחיות."
      - "קחו את ה Gem לילד ליד השער."
      - "גם לו יש כמה שמות שקשה לקרוא."
  noun_repair_q02_start:
    speaker: Little Boy
    lines:
      - "שלום. כמה תוויות בתיק שלי נקרעו."
      - "אני יודע מה יש בתיק, אבל קשה לקרוא את השמות באנגלית."
      - "עזרו לי להחזיר לכל דבר את השם הנכון."
      - "אחר כך חזרו וספרו לי מה הצלחתם לתקן."
  noun_repair_q02_finish:
    speaker: Little Boy
    lines:
      - "יש! עכשיו אפשר לקרוא את השמות על התיק."
      - "אני רואה שוב את המילים bag, book, pen ו dog."
      - "קחו את ה Power Stone לחקלאי בשוק."
      - "הוא צריך עזרה עם השלטים שלו."
  noun_repair_q03_start:
    speaker: Farmer
    lines:
      - "ברוכים הבאים לשוק."
      - "כמה שלטים ניזוקו, והלקוחות לא בטוחים מה נמצא בכל דוכן."
      - "עזרו לי להחזיר לשוק את שמות הפירות, האוכל וכלי העבודה."
      - "אחרי שתסיימו, חזרו אליי."
  noun_repair_q03_finish:
    speaker: Farmer
    lines:
      - "מצוין. עכשיו הלקוחות יכולים לקרוא את השלטים."
      - "הם יודעים מהו apple, מהו bread ומהו cup."
      - "קחו את ה Ancient Rune לאישה הזקנה."
      - "גם במטבח שלה חסרים שמות."
  noun_repair_q04_start:
    speaker: Old Woman
    lines:
      - "במטבח שלי נפלו הרבה תוויות."
      - "עכשיו קשה לדעת איך קוראים לכל כלי ולכל תפקיד."
      - "עזרו לי להחזיר את השמות, כדי שנוכל לעבוד במטבח."
      - "אחרי שתסיימו, חזרו אליי."
  noun_repair_q04_finish:
    speaker: Old Woman
    lines:
      - "תודה. עכשיו אפשר לזהות את ה chef, ה spoon וה plate."
      - "המטבח שוב מסודר, וכולם יודעים מה לעשות."
      - "קחו את ה Gem לפרופסור המשוגע."
      - "הוא מצא עוד תוויות בארמון."
  noun_repair_q05_start:
    speaker: Professor Crazy
    lines:
      - "מצאתי תוויות ישנות מהארמון, אבל חלק מהאותיות חסרות."
      - "בלי השמות הנכונים קשה לזהות את המקומות, התפקידים והחפצים."
      - "עזרו לי להשלים את השמות של castle, tower, throne ו crown."
      - "אחרי שתסיימו, חזרו אליי עם ה Power Stone."
  noun_repair_q05_finish:
    speaker: Professor Crazy
    lines:
      - "נפלא. עכשיו תוויות הארמון ברורות."
      - "אפשר לזהות את ה queen, ה guard ואת שאר הדברים."
      - "קחו את ה Power Stone למאיה."
      - "היא מחכה לכם עם הדף האחרון של הספר."
  noun_repair_q06_start:
    speaker: teacher_maya
    lines:
      - "חזרתם בזמן. ספר המילים כמעט מוכן."
      - "לפני שנפתח את החנות, נבדוק שאתם מזהים nouns."
      - "Nouns יכולים להיות אנשים, חיות, מקומות או דברים."
      - "אחרי שתסיימו, הספר יוכל להיפתח מחדש."
  noun_repair_q06_finish:
    speaker: teacher_maya
    lines:
      - "כל הכבוד! השמות חזרו לספר."
      - "עכשיו אתם יודעים לזהות, לאיית ולקרוא nouns באנגלית."
      - "Noun Repair Shop פתוח שוב."
      - "תודה על העזרה. קחו את הפרס."
