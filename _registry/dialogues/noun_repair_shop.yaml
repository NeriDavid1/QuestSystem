# Dialogue scripts for Noun Repair Shop: The Missing Names.
dialogues:
  noun_repair_q01_start:
    speaker: teacher_maya
    lines:
      - "אוי לא! ספר המילים שלי נפתח באמצע הלילה, ושמות העצם נעלמו מהעמודים."
      - "עכשיו הספר מלא בתמונות בלי שמות, ואף אחד לא יודע מה הוא רואה."
      - "אני צריכה עזרה להחזיר לספר את השמות של אנשים, מקומות, חפצים וחיות."
      - "הדפים מחכים במקום שבו נשמרו הדברים שאבדו."
      - "אחרי שתסיימו, חזרו אליי עם מה שמצאתם."
  noun_repair_q01_finish:
    speaker: teacher_maya
    lines:
      - "חזרתם! עכשיו הדפים כבר נראים הרבה יותר טוב."
      - "הספר שוב יודע להבדיל בין boy, table, park ו cat."
      - "איזה מזל שעזרתם לי. בלעדיכם הוא היה קורא לכל דבר toaster."
      - "ליד השער מחכה ילד שמצא עוד שמות מבולבלים."
      - "קחו את ה Gem אליו. אולי הסיפור שלו יעזור לנו לתקן את הספר."
  noun_repair_q02_start:
    speaker: Little Boy
    lines:
      - "שלום! התיק שלי חזר, אבל השמות שהיו עליו עדיין מבולבלים."
      - "לפעמים אני מסתכל על דבר ולא יודע איך קוראים לו באנגלית."
      - "אני רוצה שכל דבר יחזור לשם הנכון שלו."
      - "מה שנשאר מהתיק מחכה ליד העגלה."
      - "כשתחזרו, ספרו לי מה הצלחתם להציל."
  noun_repair_q02_finish:
    speaker: Little Boy
    lines:
      - "יש! עכשיו התיק שלי מספר את האמת."
      - "ה dog כבר לא מתחבא מאחורי ה pencil, וה bag שוב נראה כמו תיק."
      - "קחו את ה Power Stone לחקלאי בשוק."
      - "הוא אמר שגם אצלו השמות התחלפו."
      - "אולי הפעם apple לא ינסה להתחפש ל banana."
  noun_repair_q03_start:
    speaker: Farmer
    lines:
      - "ברוכים הבאים לשוק. היום הלקוחות מסתכלים על השלטים ולא מבינים מה לקנות."
      - "פירות, אוכל וכלי עבודה קיבלו שמות לא נכונים."
      - "אני צריך שהשוק יחזור להיות מקום פשוט וברור."
      - "הדברים שמחכים לתיקון נמצאים ליד הדוכן."
      - "אחרי שתעזרו לי, חזרו עם החדשות."
  noun_repair_q03_finish:
    speaker: Farmer
    lines:
      - "מצוין! עכשיו כולם יודעים ש apple הוא פרי ו bread הוא אוכל."
      - "הקונים שוב מוצאים את מה שחיפשו, ואף אחד לא חוזר הביתה עם hammer במקום banana."
      - "קחו את ה Ancient Rune לאישה הזקנה."
      - "במטבח שלה קרה בלבול גדול עוד יותר."
      - "אולי תוכלו להחזיר גם לשם קצת סדר."
  noun_repair_q04_start:
    speaker: Old Woman
    lines:
      - "אוי, איזה בלגן! במטבח שלי כל השמות קפצו ממקום למקום."
      - "ה spoon מתנהג כאילו הוא הטבח, וה plate מחלק פקודות."
      - "אפילו האנשים במטבח כבר לא בטוחים איך קוראים להם."
      - "אני רק רוצה שהמטבח יחזור להיות שקט ונעים."
      - "כשתסיימו, חזרו אליי. יהיה לי משהו בשבילכם."
  noun_repair_q04_finish:
    speaker: Old Woman
    lines:
      - "איזה יופי! עכשיו ה chef מבשל, ה spoon מערבב וה plate נח בשקט."
      - "המטבח שוב מרגיש כמו בית."
      - "קחו את ה Gem לפרופסור המשוגע."
      - "הוא אחראי לבלגן הבא, אבל אולי יש לו הסבר טוב."
      - "רק תיזהרו. המדע שלו אוהב הפתעות."
  noun_repair_q05_start:
    speaker: Professor Crazy
    lines:
      - "הניסוי שלי הצליח כמעט לגמרי. רק השמות בארמון עפו לכל הכיוונים."
      - "עכשיו castle, tower, throne ו crown כבר לא יודעים מי הם."
      - "אם נחזיר לכל מקום ולכל תפקיד את השם הנכון, הארמון יחזור לעצמו."
      - "השארתי את הדברים שצריכים עזרה במקום שבו עובדים על הסימנים."
      - "אחרי שתסיימו, חזרו אליי עם ה Power Stone."
  noun_repair_q05_finish:
    speaker: Professor Crazy
    lines:
      - "נפלא! ה queen שוב יושבת על ה throne, וה crown חזר לראש."
      - "אפילו ה guard יודע עכשיו מי הוא."
      - "קחו את ה Power Stone למאיה."
      - "היא שמרה את הדף האחרון של הספר."
      - "נראה אם הספר מוכן להיפתח מחדש."
  noun_repair_q06_start:
    speaker: teacher_maya
    lines:
      - "חזרתם בדיוק בזמן. כל חלקי הספר נמצאים כאן."
      - "הספר רוצה להכיר אתכם לפני שייפתח שוב בפני כל הילדים."
      - "הוא יעבור איתכם על שמות של אנשים, חפצים, מקומות וחיות."
      - "אחרי שתסיימו, חזרו אליי. ואז נוכל לפתוח מחדש את החנות."
      - "אני מאמינה בכם. אתם כבר צוות תיקון מצוין."
  noun_repair_q06_finish:
    speaker: teacher_maya
    lines:
      - "וואו! הספר נפתח, וכל השמות חזרו למקום שלהם."
      - "עכשיו אתם יודעים לזהות noun, לאיית אותו ולקרוא אותו באנגלית."
      - "ה cat קיבל שם, ה table הפסיק לבקש כתר, והחנות יכולה להיפתח."
      - "תודה רבה, גיבורי המילים."
      - "קחו את הפרס, ורק תיזהרו מה toaster."
