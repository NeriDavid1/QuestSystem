# Hebrew-first bilingual story: short guidance with limited English targets.
dialogues:
  numbers_advanced_q01_start:
    speaker: Little Boy
    lines:
      - "אוי לא! מפת המספרים שלי התפרקה, ואני לא מצליח לסדר את החלק הראשון."
      - "החלק הראשון מכיל את המספרים 10 עד 20. תעזרו לי למצוא את המילים החסרות."
      - "המספרים התפזרו, ואני צריך את עזרתכם כדי להחזיר אותם למפה."
  numbers_advanced_q01_finish:
    speaker: Little Boy
    lines:
      - "יש! החלק הראשון של המפה חזר למקום. עכשיו אני יודע לקרוא 10 עד 20."
      - "האיכר Farmer מחכה בשוק עם חלק נוסף של המפה. לכו אליו."
  numbers_advanced_q02_start:
    speaker: Farmer
    lines:
      - "השלטים בשוק התבלבלו, והקונים לא יודעים איזה מספר שייך לכל מקום."
      - "המספרים מ־20 עד 100 צריכים לחזור למפה."
      - "עזרו לי להחזיר סדר לשוק."
  numbers_advanced_q02_finish:
    speaker: Farmer
    lines:
      - "מצוין! השוק מסודר, והשלטים של 20 עד 100 ברורים לכולם."
      - "פרופסור קרייזי Professor Crazy מחכה במגדל עם החלק האחרון. לכו אליו."
  numbers_advanced_q03_start:
    speaker: Professor Crazy
    lines:
      - "החלק הגדול של המפה הגיע אליי."
      - "אבל המספרים מ־100 עד 1000 עדיין חסרים."
      - "עזרו לי להשלים את המפה."
  numbers_advanced_q03_finish:
    speaker: Professor Crazy
    lines:
      - "הצלחתם! מפת המספרים שלמה, ואתם יכולים לקרוא מספרים מ־10 עד 1000."
      - "מורה מאיה Teacher Maya מחכה לכם עם האתגר האחרון. לכו אליה."
  numbers_advanced_q04_start:
    speaker: teacher_maya
    lines:
      - "כל הכבוד! שלושת חלקי המפה הגיעו אליי. עכשיו נחבר אותם לאתגר אחד."
      - "בואו נבדוק שכל חלקי המפה ברורים."
      - "כשתסיימו, חזרו אליי."
  numbers_advanced_q04_finish:
    speaker: teacher_maya
    lines:
      - "תודה על העזרה! עזרתם לי מאוד."
      - "עכשיו מפת המספרים מוכנה."
      - "קבלו 10 מטבעות."
