# Wh-Questions homework - the ghost's question notebook. The ghost is feminine throughout.
# Homework teaches nothing new: no rule before practice, a short rule reminder at the end.
# Hebrew-first, short blocks. No quotation marks inside dialogue text. No em dash.
dialogues:

  wh_questions_homework_q01_start:
    speaker: Ghost
    lines:
      - "חזרתם. בזכותכם אני זוכרת את השם שלי ואת הלילה של הסערה."
      - "עכשיו אני כותבת מחברת שאלות, כדי שלא אשכח שוב אף פעם."
      - "היום אין מילים חדשות. תראו לי לבד שאתם זוכרים את כל מילות השאלה."

  wh_questions_homework_q01_finish:
    speaker: Ghost
    lines:
      - "המחברת מלאה בשאלות טובות. עכשיו אני כבר לא מפחדת לשכוח."
      - "זכרו: What = מה, על דבר. Where = איפה, על מקום. When = מתי, על זמן."
      - "Who = מי, על אדם. Why = למה, על סיבה. How = איך, על הדרך שבה משהו קורה."
      - "כל הכבוד. עשיתם את שיעורי הבית לבד."
