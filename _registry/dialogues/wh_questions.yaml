# Wh-Questions - a ghost detective story. Hebrew-first, short blocks.
# No quotation marks inside dialogue text. No em dash.
# The ghost is feminine throughout.
dialogues:
  wh_questions_q01_start:
    speaker: Ghost
    lines:
      - "שלום. אני רוח קטנה, ואני לא זוכרת מי אני. אני זוכרת רק ים וסערה."
      - "כדי להיזכר צריך לשאול שאלות מידע. שאלת מידע = Wh-question. היא מתחילה במילת שאלה ומבקשת מידע, ולא תשובה של כן או לא."
      - "נתחיל בשתיים. What = מה, שואלים על דבר. Where = איפה, שואלים על מקום."
      - "בואו נמצא את החלק הראשון בזיכרון שלי."
  wh_questions_q01_finish:
    speaker: Ghost
    lines:
      - "רגע. אני נזכרת בספינה על המים, ובשם שקראו לי בלילה ההוא."
      - "נמו Nemo דג במפרץ באותו ערב. אולי הוא ראה מי הייתה שם. לכו אליו."

  wh_questions_q02_start:
    speaker: Fisherman
    lines:
      - "רוח? כן, אני זוכר את הלילה הזה. הרשת שלי נקרעה מהרוח החזקה."
      - "אבל אני לא זוכר מי עמדה על הסיפון ובאיזו שעה זה קרה."
      - "Who = מי, שואלים על אדם. When = מתי, שואלים על זמן."
      - "עזרו לי לשאול נכון, ואני אספר לכם את כל מה שראיתי."
  wh_questions_q02_finish:
    speaker: Fisherman
    lines:
      - "עכשיו זה ברור. מלחה צעירה עמדה על הסיפון, והסערה הגיעה אחרי חצות."
      - "התותחן במפרץ הנטוש שמע רעש גדול באותו לילה. הוא יודע למה זה קרה."

  wh_questions_q03_start:
    speaker: Cannoneer
    lines:
      - "שמעתי רעש נורא מהמים, ומאז אני שואל את עצמי שאלה אחת שוב ושוב."
      - "Why = למה, שואלים על סיבה. How = איך, שואלים על האופן שבו משהו קורה."
      - "שתי המילים נשמעות דומות בסיפור, אבל הן מחפשות דברים שונים."
      - "עזרו לי, ונדע למה הספינה נשברה."
  wh_questions_q03_finish:
    speaker: Cannoneer
    lines:
      - "עכשיו הסיפור מסתדר. הרוח החזקה שברה את התורן, והספינה לא הצליחה לחזור."
      - "הילדה הקטנה מחכה מתחת לעץ הכתום הגדול. היא אוספת שאלות בשביל הרוח."

  wh_questions_q04_start:
    speaker: "Little Girl"
    lines:
      - "אמא אמרה שאסור לדבר עם רוחות, אבל אני רוצה לעזור לרוח העצובה."
      - "אני יושבת כאן מתחת לעץ הכתום הגדול וכותבת שאלות במחברת."
      - "רק שכל השאלות שלי מתחילות בצורה לא נכונה."
      - "בשאלת מידע מילת השאלה תמיד עומדת בהתחלה, ואחריה שאר המשפט."
      - "בואו נסדר את השאלות שלי יחד."
  wh_questions_q04_finish:
    speaker: "Little Girl"
    lines:
      - "וואו, עכשיו כל שאלה נשמעת נכון. אני אשמור את המחברת בשביל הרוח."
      - "מדריך ההרים מדליק מדורה במגדל בכל לילה. שם אפשר לספר לרוח את כל הסיפור."

  wh_questions_q05_start:
    speaker: "Mountain Guide"
    lines:
      - "המדורה דולקת, והרוח כבר מחכה כאן. חסר רק דבר אחד."
      - "צריך לשאול את כל שש השאלות בקול, כדי שהסיפור יהיה שלם."
      - "What, Where, When, Who, Why, How. הפעם הכול מעורבב יחד."
  wh_questions_q05_finish:
    speaker: "Mountain Guide"
    lines:
      - "הרוח שמעה את הסיפור המלא, והיא נרגעת מול האש. קוראים לה בו Boo."
      - "עשיתם עבודת חקירה מצוינת עם כל מילות השאלה."
      - "קבלו עשרה מטבעות עכשיו. סיימתם את הסיפור בהצלחה!"
