dialogues:
  nouns_festival_q02_start:
    speaker: "Village Head"
    lines:
      - "ברוכים הבאים לפסטיבל. אני צריך עזרה לפני שהשערים ייפתחו."
      - "החקלאי ביקש ממני להכין כמה דברים לדוכן שלו, אבל אני לא מספיק לבד."
      - "עזרו לי לסדר את האזור, ואחר כך אשלח אתכם אליו כדי לעזור עם החיות."
  nouns_festival_q03_start:
    speaker: Farmer
    lines:
      - "שלום! החיות של המופע ברחו בזמן שהתכוננתי לפסטיבל."
      - "עזרו לי למצוא את השלטים שלהן ולהחזיר את המופע למסלול."
  nouns_festival_q03_progress:
    speaker: Farmer
    lines:
      - "מצוין, החיות הראשונות כבר יכולות לחזור למתחם."
      - "נשאר עוד שלט אחד למצוא לפני שהמופע יתחיל."
  nouns_festival_q04_start:
    speaker: Blacksmith
    lines:
      - "החקלאי שלח אתכם אליי? טוב שהגעתם, כי הדוכן שלי עדיין מבולגן."
      - "הכלים והקישוטים התפזרו, והמבקרים יגיעו בקרוב. עזרו לי לסדר אותם."
  nouns_festival_q04_progress:
    speaker: Blacksmith
    lines:
      - "יפה, רוב הדברים כבר במקום."
      - "נשאר עוד חפץ אחד, ואז הדוכן יהיה מוכן."
  nouns_festival_q05_start:
    speaker: "Main Gate Gaurd 2"
    lines:
      - "הנפח שלח אתכם אל השער? בדיוק בזמן."
      - "השלטים ליד הכניסה התבלבלו, והאורחים לא יודעים מי נמצא כאן ולאן ללכת."
      - "עזרו לי לסדר את השלטים לפני שהקהל יגיע."
  nouns_festival_q05_progress:
    speaker: "Main Gate Gaurd 2"
    lines:
      - "כל הכבוד, השלטים של האנשים כבר ברורים."
      - "נשאר עוד שלט אחד ליד השער."
  nouns_festival_q06_start:
    speaker: "Village Head"
    lines:
      - "גאריק שלח אתכם אליי. עכשיו נוכל לפתוח את הפסטיבל."
      - "נשארו כמה שלטים אחרונים, והאורחים צריכים להבין אותם במהירות."
      - "עזרו לי לסדר את המשפטים שעל השלטים, כדי שאף אחד לא ילך לאיבוד."
  nouns_festival_q06_progress:
    speaker: "Village Head"
    lines:
      - "מצוין, השלטים כבר עוזרים לאורחים למצוא את הדרך."
      - "נשארו רק השלטים האחרונים ליד הכיכר."
  nouns_festival_q02_finish:
    speaker: "Village Head"
    lines:
      - "כל הכבוד! סיימתם את ההכנות הראשונות לפסטיבל."
      - "עכשיו לכו אל החקלאי Farmer בפארק ורד הפרחים. הוא מחכה לכם עם משימת החיות."
  nouns_festival_q03_finish:
    speaker: Farmer
    lines:
      - "מצוין! החיות מוכנות עכשיו למופע."
      - "עכשיו לכו אל ויל Will The Smith בבית הבנאים. הוא צריך עזרה עם חפצי הפסטיבל."
  nouns_festival_q04_finish:
    speaker: Blacksmith
    lines:
      - "נהדר! החפצים מוכנים והדוכן מסודר."
      - "לכו אל גאריק Garrick the Unmoving בשער הממלכה. הוא מחכה לכם עם המשימה הבאה."
  nouns_festival_q05_finish:
    speaker: "Main Gate Gaurd 2"
    lines:
      - "כל הכבוד! השלטים ליד השער ברורים לאורחים."
      - "עכשיו חזרו אל ראש הכפר Village Head בפארק ורד הפרחים. הוא ייתן לכם את המשימה האחרונה."
  nouns_festival_q06_finish:
    speaker: "Village Head"
    lines:
      - "כל הכבוד! השלמתם את כל שלטי הפסטיבל."
      - "עכשיו האורחים יכולים לקרוא את השלטים ולהגיע לכל דוכן. תודה על העזרה!"
