# Noun Repair Shop homework - the first full box of broken tags after the shop reopened.
# Maya is feminine throughout. Homework teaches nothing new: no rule before practice,
# a short rule reminder at the end. Hebrew-first, short blocks. No quotation marks inside
# dialogue text. No em dash.
dialogues:

  noun_repair_shop_homework_q01_start:
    speaker: teacher_maya
    lines:
      - "שלום שוב. מאז שהחנות נפתחה מחדש, מביאים אליה תוויות שבורות מכל הממלכה."
      - "הבוקר הגיעה קופסה מלאה, ומחר הבעלים באים לקחת את התוויות שלהם."
      - "היום אין שום דבר חדש, רק שמות שאתם כבר מכירים. הפעם תתקנו לבד - הקופסה מחכה לכם על שולחן התיקונים בפארק."

  noun_repair_shop_homework_q01_finish:
    speaker: teacher_maya
    lines:
      - "כל התוויות בקופסה מתוקנות, ומחר כל אחת תחזור לבעלים שלה."
      - "עכשיו אני יודעת שאפשר לסמוך עליכם בחנות גם כשאני לא כאן."
      - "זכרו: Noun = שם עצם, שם של אדם, חיה, מקום או דבר. למשל queen = מלכה, bird = ציפור, tower = מגדל, crown = כתר."
      - "כל הכבוד. עשיתם את שיעורי הבית לבד."
