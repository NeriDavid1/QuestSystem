questlines:
  blacksmith_will:
    display_name: "ויל הנפח — ה־Slash הראשון"
    theme: "הרפתקאות מצחיקות בנפחייה; פתיחת Slash עם המילים הכי קלות"
    quests:
      q01_runaway_hammer:
        name: "הפטיש הבורח"
        summary: "הפטיש של ויל רץ אחרי חתול — אייתו CAT במפרץ, הביאו Oak Log אחד."
      q02_snoring_anvil:
        name: "הסדן הנוחר"
        summary: "הסדן מתעורר רק לסיפור על כלב — אייתו DOG בבית הבנאים, הביאו Herbs אחד."
      q03_first_real_slash:
        name: "ה־Slash הראשון"
        summary: "אייתו BIG ליד שער הממלכה, חזרו לוויל וקבלו את יכולת Slash."

  adjective_crown:
    display_name: "כתר התארים"
    theme: "תרגול תארים באנגלית באמצעות משחקים, קבלת פריטים ומסירתם למאיה"
    quests:
      q01_bridge_too_short:
        name: "הגשר קצר מדי"
        summary: "אייתו LONG, קבלו Oak Log אחד ומסרו אותו למאיה."
      q02_whispering_stone:
        name: "האבן הלוחשת"
        summary: "אמרו HOT, קבלו Herbs אחד ומסרו אותו למאיה."
      q03_big_and_small_words:
        name: "המילים גדול וקטן"
        summary: "השלימו BIG ואמרו SMALL, קבלו שני פריטי Corn ומסרו אותם למאיה."
      q04_twelve_basic_adjectives:
        name: "שנים־עשר תארים בסיסיים"
        summary: "השלימו שנים־עשר משחקים, קבלו שנים־עשר Ancient Runes ומסרו אותם למאיה."
      q05_from_low_to_high:
        name: "מלמטה למעלה"
        summary: "השלימו ארבעה משחקי LOW/HIGH, קבלו ארבעה Power Stones ומסרו אותם למאיה."
      q06_adjective_challenge:
        name: "אתגר התארים"
        summary: "השלימו שלושה משחקי התאמה (4 מילים בכל אחד), קבלו Gem אחד ומסרו אותו למאיה."

  english_kingdom_maya:
    display_name: "ממלכת האנגלית — מסלול האותיות"
    theme: "לימוד אותיות A–J (רמות 1–10)"
    quests:
      q01_runaway_a:
        name: "האות A הבורחת"
        summary: "מאיה מברכת אתכם בממלכת האנגלית — האות A בורחת כי היא חושבת שהיא מלכת האלף-בית!"
      q02_bee_bandit:
        name: "דבורת השודדת"
        summary: "דבורה שובבה גנבה את האות B מהשלט BEE — בלי B, הדבורים שוכחות איך לזמזם באנגלית!"
      q03_cat_on_c:
        name: "חתול על ה-C"
        summary: "החתול של מאיה ישב על האות C וכיווץ אותה לצורת קרואסון — עכשיו קוראים לה 'כרוסון'!"
      q04_dog_ate_homework:
        name: "הכלב אכל את ה-D"
        summary: "הכלב של מאיה אכל את האות D משיעורי הבית — עכשיו dog נראית כמו _og!"
      q05_mystery_egg:
        name: "הביצה המסתורית"
        summary: "ביצה ענקית חוסמת את שער הגן — היא רוצה לשמוע את האות E לפני שהיא נפתחת."
      q06_butterfly_chaos:
        name: "כאוס הפרפרים"
        summary: "פרפרים עם אות F על הכנפיים משנים שלטים ל-FLY או FRY (צ'יפס מעופף)!"
      q07_genius_gate:
        name: "שער הגאון"
        summary: "שער הגאון נעול — הוא מבקש את האות G ושלוש מילים קלות, אבל לא יודע לפתוח את עצמו."
      q08_hat_hunt:
        name: "ציד הכובע של מאיה"
        summary: "מאיה איבדה את הכובע (HAT) — בלי H, הכובע הפך ל-_AT וחתול ישב עליו בגשם."
      q09_letter_island:
        name: "בלגן באי האותיות"
        summary: "על אי האותיות הכל מתערבב — האי חושב ש-I נראית כמו 1 ורוצה שתסדרו את הבלגן."
      q10_word_hero:
        name: "גיבור המילים"
        summary: "מבחן הסיום! האות J היא האחרונה — אמורו אותה בקול וקבלו תג גיבור המילים."

  kingdom_nouns:
    display_name: "ספר ה־nouns של הממלכה"
    theme: "לימוד nouns מעולם הממלכה דרך סיפור מצחיק — איות ודיבור (משימה ראשונה רמה 50; השאר רמה 1)"
    quests:
      q01_roles_without_names:
        name: "תפקידים בלי שמות"
        summary: "אייתו king ליד המזרקה, אמרו king / queen / knight, מסרו Gem למאיה."
      q02_castle_on_the_map:
        name: "הטירה שהפכה למגדל"
        summary: "אייתו castle ליד השער, אמרו castle / tower / gate, מסרו Gem לפן הפטפטן."
      q03_crown_soup:
        name: "מרק הכתר"
        summary: "אייתו crown במגדל הבדידות, אמרו crown / throne / treasure, מסרו Power Stone לפרופסור משוגע."
      q04_soup_shield:
        name: "מגן המרק"
        summary: "אייתו shield על הגשר, אמרו sword / shield / scroll, מסרו Power Stone לוויל הנפח."
      q05_wizard_for_sale:
        name: "הקוסם במטבח"
        summary: "אייתו wizard במגדל המשמר, אמרו wizard / cook / guard, מסרו Power Stone לזקנה."
      q06_dragon_identity:
        name: "הדרקון שהפך לגובלין"
        summary: "אייתו dragon במפרץ הנטוש, אמרו dragon / griffin / goblin, מסרו Ancient Rune לתותחן."
      q07_royal_noun_trial:
        name: "מבחן ה־nouns המלכותי"
        summary: "סדרו חמישה nouns מוכרים, אמרו אחד מכל קבוצה, מסרו Ancient Rune למאיה."
