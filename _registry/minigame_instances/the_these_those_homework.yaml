# Homework for the The, These & Those line (near and far on the farm). One quest, no new rule:
# every task asks for the (a known thing), these (near, more than one) or those (far, more than one),
# in new sentences built only from words the lesson already used.
# Ladder: recognise what can follow these / those (Dwarf Miner) -> build near (Word Ordering)
# -> build far (Word Ordering) -> build fast, the + those in one sentence (Fruit Slice)
# -> the one-hat trap: near but only one, so The (Word Ordering) -> say it (Speak Aloud, full phrase checked).
# Every Hebrew translation marks near / far with האלה / ההם, so these / those is never a guess.
# No Word Matching: it has no prompt field and no picture per card, so ___ BOOTS could take these or those.
instances:

  the_these_those_homework_q01_mine_more_than_one:
    minigame_id: dwarf_miner
    instruction: "אספו רק מילים שיכולות לבוא אחרי these או those."
    tasks: [pigs, boots, trees, kids, clouds, knights]
    target: "pigs, boots, trees, kids, clouds, knights"
    variant: word_category
    success: "נכון. אחרי these ו־those תמיד באים כמה דברים, לא דבר אחד."
    params:
      prompt: "אספו רק מילים שיכולות לבוא אחרי these או those."
      categoryLabel: "these / those"
      targetWords: [pigs, boots, trees, kids, clouds, knights]
      distractorWords: [dog, axe, hat, boy, bag, is]
      requiredCorrect: 5
      allowedMistakes: 3

