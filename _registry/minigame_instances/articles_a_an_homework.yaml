# Homework for the A / An line (Nemo's practice net). One quest, no new rule: every task is an
# a / an choice built from words the lesson already used, in new combinations.
# Ladder: recognise (Dwarf Miner) -> apply (Word Matching) -> build (Word Ordering)
# -> build fast (Fruit Slice) -> the describing-word trap (Word Ordering) -> say it (Speak Aloud).
# Word Matching tile order [an, a, a, an] is fixed and non-alternating (two values only), and differs
# from every lesson pool. Speak Aloud uses phrase mode like the lesson line.
instances:

  articles_a_an_homework_q01_mine_an_words:
    minigame_id: dwarf_miner
    instruction: "אספו רק את המילים שבאות אחרי an."
    tasks: [apple, egg, owl, ant, orange, octopus]
    target: "apple, egg, owl, ant, orange, octopus"
    variant: word_category
    success: "הרשת תפסה רק את המילים של AN."
    params:
      prompt: "אספו רק את המילים שבאות אחרי an."
      categoryLabel: "an"
      targetWords: [apple, egg, owl, ant, orange, octopus]
      distractorWords: [fish, boat, cake, banana, net, hat]
      requiredCorrect: 5
      allowedMistakes: 3

  articles_a_an_homework_q01_match_little_words:
    minigame_id: word_matching
    instruction: "חברו כל מילה ל־a או ל־an."
    tasks: ["___ OWL", "___ HAT", "___ OLD CAT", "___ SMALL APPLE"]
    target: "an owl, a hat, an old cat, a small apple"
    variant: missing_letter_matching
    success: "עוד קשרים חזקים נוספו לרשת."
    params:
      letters:
        - { id: art_hw_tile_1, value: an }
        - { id: art_hw_tile_2, value: a }
        - { id: art_hw_tile_3, value: a }
        - { id: art_hw_tile_4, value: an }
      wordTasks:
        - { id: art_hw_task_owl, image: '', fullWord: an owl, missingIndices: [0, 1] }
        - { id: art_hw_task_hat, image: '', fullWord: a hat, missingIndices: [0] }
        - { id: art_hw_task_old_cat, image: '', fullWord: an old cat, missingIndices: [0, 1] }
        - { id: art_hw_task_small_apple, image: '', fullWord: a small apple, missingIndices: [0] }

  articles_a_an_homework_q01_an_old_boat:
    minigame_id: word_ordering
    instruction: "בנו את המשפט באנגלית לפי התרגום המלא בעברית. סדרו את כל המילים."
    tasks: [I, have, an, old, boat]
    target: "I have an old boat."
    variant: sentence_building
    success: "נכון. המילה שבאה מיד אחרי היא old, ולכן an."
    params:
      prompt: "בנו את המשפט באנגלית לפי התרגום המלא בעברית: יש לי סירה ישנה. סדרו את כל המילים."
      translation: "יש לי סירה ישנה."
      englishWordsInOrder: [I, have, an, old, boat]
      preFilledIndices: []
      distractorWords: [a, the, big]

  articles_a_an_homework_q01_owl_in_a_tree:
    minigame_id: fruit_slice
    instruction: "חתכו את הפירות לפי הסדר ובנו את המשפט באנגלית."
    tasks: [I, see, an, owl, in, a, tree]
    target: "I see an owl in a tree"
    variant: word_slicing
    success: "נכון. an לפני owl, ו־a לפני tree."
    params:
      prompt: "חתכו את הפירות לפי הסדר ובנו את המשפט באנגלית: אני רואה ינשוף על עץ."
      segmentation: Words
      targetText: "I see an owl in a tree"
      preFilledIndices: [0, 1]
      distractors: [the, two, egg]
      extraLetterDistractorCount: 0

  articles_a_an_homework_q01_a_big_apple:
    minigame_id: word_ordering
    instruction: "בנו את המשפט באנגלית לפי התרגום המלא בעברית. סדרו את כל המילים."
    tasks: [This, is, a, big, apple]
    target: "This is a big apple."
    variant: sentence_building
    success: "נכון. המילה שבאה מיד אחרי היא big, ולכן a."
    params:
      prompt: "בנו את המשפט באנגלית לפי התרגום המלא בעברית: זה תפוח גדול. סדרו את כל המילים."
      translation: "זה תפוח גדול."
      englishWordsInOrder: [This, is, a, big, apple]
      preFilledIndices: []
      distractorWords: [an, the, small]

  articles_a_an_homework_q01_say_i_want_an_egg:
    minigame_id: speak_aloud
    instruction: "אמרו את המשפט הבא באנגלית בקול."
    tasks: [I, want, an, egg]
    target: "I want an egg."
    variant: short_phrase
    success: "הרשת גמורה ומוכנה למלכת הים."
    params:
      prompt: "אמרו את המשפט הבא באנגלית בקול. משמעותו בעברית: אני רוצה ביצה."
      targetWords: []
      targetPhrase: "I want an egg."
      silenceTimeoutSeconds: 3.0
      allowFuzzyMatch: true
      referenceClip: ''
