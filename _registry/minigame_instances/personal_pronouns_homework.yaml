# Homework for the Personal Pronouns line (rehearsal for the next show). One quest, no new words:
# every task asks the learner to pick the pronoun that fits a person, a group, an object or an animal.
# Ladder: recognise what It stands for (Dwarf Miner) -> build (Word Ordering) -> spell (Letter Ordering)
# -> build (Word Ordering) -> build fast (Fruit Slice) -> say it (Speak Aloud, full phrase checked).
instances:

  personal_pronouns_homework_q01_mine_it_words:
    minigame_id: dwarf_miner
    instruction: "אספו רק את מה שאפשר לקרוא לו It."
    tasks: [hat, crown, dog, ball, cat, tree]
    target: "hat, crown, dog, ball, cat, tree"
    variant: word_category
    success: "נכון. It בא במקום חפץ או בעל חיים, אף פעם לא במקום אדם."
    params:
      prompt: "אספו רק את מה שאפשר לקרוא לו It."
      categoryLabel: "It"
      targetWords: [hat, crown, dog, ball, cat, tree]
      distractorWords: [king, girl, teacher, mother, boy, singer]
      requiredCorrect: 5
      allowedMistakes: 3

