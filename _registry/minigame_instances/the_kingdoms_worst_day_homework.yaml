# Homework for The Kingdom's Worst Day line (Fenn's windy evening). One quest, no new words: every task
# asks the learner to tell nouns, verbs and adjectives apart or to put them in the right place. Words come
# from the lesson only (help / make from its closing line Words make sentences, and sentences help ...).
# Ladder: recognise verbs (Dwarf Miner) -> each kind of word in its place (Word Matching, whole-word mode,
# four values, no tile opposite its own line) -> build a description with is (Word Ordering) -> build fast
# (Fruit Slice) -> the Hebrew-order trap, two describing words before their nouns (Word Ordering)
# -> say it (Speak Aloud, every word checked like the lesson line). No lesson or missing_verbs sentence repeats.
instances:

  the_kingdoms_worst_day_homework_q01_mine_verbs:
    minigame_id: dwarf_miner
    instruction: "אספו רק את מילות הפעולה."
    tasks: [fix, open, carry, close, help, make]
    target: "fix, open, carry, close, help, make"
    variant: word_category
    success: "נכון. כל המילים שאספתם מספרות מה עושים, וכרטיסי הפעולה חזרו למקום."
    params:
      prompt: "אספו רק את מילות הפעולה."
      categoryLabel: "Verbs"
      targetWords: [fix, open, carry, close, help, make]
      distractorWords: [key, gate, tool, big, dark, bright]
      requiredCorrect: 5
      allowedMistakes: 3

  the_kingdoms_worst_day_homework_q01_match_word_places:
    minigame_id: word_matching
    instruction: "חברו כל מילה למקום החסר שמתאים לה."
    tasks: ["I ___ THE BOOK", "THE ___ TREE", "THE BIG ___", "THE GATE ___ DARK"]
    target: "I close the book, the small tree, the big tool, the gate is dark"
    variant: missing_letter_matching
    success: "נכון. כל מילה נכנסה למקום שמתאים לסוג שלה, וארבע שורות קצרות חזרו ללוח."
    params:
      letters:
        - { id: kwd_hw_tile_1, value: is }
        - { id: kwd_hw_tile_2, value: tool }
        - { id: kwd_hw_tile_3, value: close }
        - { id: kwd_hw_tile_4, value: small }
      wordTasks:
        - { id: kwd_hw_task_close_book, image: '', fullWord: I close the book, missingIndices: [2, 3, 4, 5, 6] }
        - { id: kwd_hw_task_small_tree, image: '', fullWord: the small tree, missingIndices: [4, 5, 6, 7, 8] }
        - { id: kwd_hw_task_big_tool, image: '', fullWord: the big tool, missingIndices: [8, 9, 10, 11] }
        - { id: kwd_hw_task_gate_is_dark, image: '', fullWord: the gate is dark, missingIndices: [9, 10] }

  the_kingdoms_worst_day_homework_q01_the_crown_is_small:
    minigame_id: word_ordering
    instruction: "בנו את המשפט באנגלית לפי התרגום המלא בעברית. סדרו את כל המילים."
    tasks: [The, crown, is, small]
    target: "The crown is small."
    variant: sentence_building
    success: "נכון. המילה small מתארת את הכתר ובאה אחרי is, והשורה חזרה ללוח."
    params:
      prompt: "בנו את המשפט באנגלית לפי התרגום המלא בעברית: הכתר קטן. סדרו את כל המילים."
      translation: "הכתר קטן."
      englishWordsInOrder: [The, crown, is, small]
      preFilledIndices: []
      distractorWords: [big, dark, book]

  the_kingdoms_worst_day_homework_q01_open_the_big_book:
    minigame_id: fruit_slice
    instruction: "חתכו את הפירות לפי הסדר ובנו את המשפט באנגלית."
    tasks: [Open, the, big, book]
    target: "Open the big book"
    variant: word_slicing
    success: "נכון. big בא לפני book, והשורה על הספר הגדול חזרה ללוח."
    params:
      prompt: "חתכו את הפירות לפי הסדר ובנו את המשפט באנגלית: פתחו את הספר הגדול."
      segmentation: Words
      targetText: "Open the big book"
      preFilledIndices: []
      distractors: [Close, small, gate]
      extraLetterDistractorCount: 0

  the_kingdoms_worst_day_homework_q01_small_key_big_gate:
    minigame_id: word_ordering
    instruction: "בנו את המשפט באנגלית לפי התרגום המלא בעברית. סדרו את המילים החסרות."
    tasks: [The, small, key, opens, the, big, gate]
    target: "The small key opens the big gate."
    variant: sentence_building
    success: "נכון. כל מילת תיאור באה לפני שם העצם שלה, ועכשיו השומרים יודעים איזה מפתח לקחת בבוקר."
    params:
      prompt: "בנו את המשפט באנגלית לפי התרגום המלא בעברית: המפתח הקטן פותח את השער הגדול. סדרו את המילים החסרות."
      translation: "המפתח הקטן פותח את השער הגדול."
      englishWordsInOrder: [The, small, key, opens, the, big, gate]
      preFilledIndices: [0, 4]
      distractorWords: [dark, closes, book]

  the_kingdoms_worst_day_homework_q01_say_close_the_big_gate:
    minigame_id: speak_aloud
    instruction: "אמרו את המשפט הבא באנגלית בקול."
    tasks: [Close, the, big, gate]
    target: "Close the big gate."
    variant: short_phrase
    success: "השומרים סוגרים את השער הגדול, והממלכה הולכת לישון בשקט."
    params:
      prompt: "אמרו את המשפט הבא באנגלית בקול. משמעותו בעברית: סגרו את השער הגדול."
      targetWords: [Close, the, big, gate]
      targetPhrase: "Close the big gate."
      silenceTimeoutSeconds: 3.0
      allowFuzzyMatch: true
      referenceClip: ''
