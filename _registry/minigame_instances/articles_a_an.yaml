# Runtime briefs for the A / An questline (Nemo and the twin fish).
# Every task is an a / an choice. Word Ordering pools always offer the other article (from Q2 on),
# and Word Matching connects each noun to a or an: the article is a whole-word blank (shown as ___),
# so the blank length never reveals the answer. Simple, familiar vocabulary only.
# Speak Aloud uses phrase mode: targetWords is empty and targetPhrase holds the sentence, so the
# Unity SpeakAloudDataSO is synced as a phrase instead of a list of single words.
# a / an tile order: with only two values, never placing a tile opposite its own word would reveal
# every answer, so each pool uses a fixed non-alternating order where some tiles sit next to their word.
# Speak Aloud sentences stay at four words or fewer, so the game forgives no missed word (a / an included).
instances:

  # --- Q01 - The Fisherman With No Net ---
  articles_a_an_q01_a_fish:
    minigame_id: word_ordering
    instruction: "בנו את התיאור באנגלית לפי התרגום המלא בעברית. סדרו את כל המילים."
    tasks: [a, fish]
    target: "a fish"
    variant: sentence_building
    success: "נכון. a מראה שמדובר בדג אחד."
    params:
      prompt: "בנו את התיאור באנגלית לפי התרגום המלא בעברית: דג אחד. סדרו את כל המילים."
