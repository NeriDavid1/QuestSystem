# Runtime briefs for the A / An questline (Nemo and the twin fish).
# Letter pools are shuffled independently of wordTasks; no tile sits opposite its own word.
# Word Ordering pools always offer the other article, so the choice between a and an must be made by the rule.
instances:

  # --- Q1 - The Fisherman With No Net ---
  articles_a_an_q01_match_sea_words:
    minigame_id: word_matching
    instruction: "השלימו את האות החסרה במילה."
    tasks: [FIS_, _OAT, N_T]
    target: "fish, boat, net"
    variant: missing_letter_matching
    success: "המילים של הים חזרו אל התיבה."
    params:
      letters:
        - { id: art_q01a_tile_e, value: e }
        - { id: art_q01a_tile_d, value: d }
        - { id: art_q01a_tile_h, value: h }
        - { id: art_q01a_tile_a, value: a }
        - { id: art_q01a_tile_b, value: b }
      wordTasks:
        - { id: art_q01a_task_fish, image: '', fullWord: fish, missingIndices: [3] }
        - { id: art_q01a_task_boat, image: '', fullWord: boat, missingIndices: [0] }
        - { id: art_q01a_task_net, image: '', fullWord: net, missingIndices: [1] }

  articles_a_an_q01_spell_net:
    minigame_id: letter_ordering
    instruction: "כתבו באנגלית את המילה שפירושה רשת."
    tasks: [n, e, t]
    target: net
    variant: word_spelling
    success: "נכון. זאת המילה שנמו הכי צריך."
    params:
      prompt: "כתבו באנגלית את המילה שפירושה רשת."
      targetWord: net
      extraDistractorCount: 2
      customDistractors: []

  articles_a_an_q01_a_big_fish:
    minigame_id: word_ordering
    instruction: "בנו את התיאור באנגלית לפי התרגום המלא בעברית. סדרו את כל המילים."
    tasks: [a, big, fish]
    target: "a big fish"
    variant: sentence_building
    success: "נכון. a מראה שמדובר בדג אחד."
    params:
      prompt: "בנו את התיאור באנגלית לפי התרגום המלא בעברית: דג גדול אחד. סדרו את כל המילים."
      translation: "דג גדול אחד"
      englishWordsInOrder: [a, big, fish]
      preFilledIndices: []
      distractorWords: [the, small, boat]

  articles_a_an_q01_say_boat:
    minigame_id: speak_aloud
    instruction: "אמרו את המשפט הבא באנגלית בקול."
    tasks: [I, have, a, boat]
    target: "I have a boat."
    variant: single_word
    success: "הרשת הראשונה מחזיקה חזק."
    params:
      prompt: "אמרו את המשפט הבא באנגלית בקול. משמעותו בעברית: יש לי סירה."
      targetWords: [boat]
      targetPhrase: "I have a boat."
      silenceTimeoutSeconds: 2.5
      allowFuzzyMatch: true
      referenceClip: ''

