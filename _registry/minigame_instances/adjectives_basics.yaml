# Runtime briefs for the Adjectives Basics questline (the painter and the grey painting).
# Letter pools are shuffled independently of wordTasks; no tile sits opposite its own word.
instances:

  # --- Q1 - The Painting With No Colors (Painter, The Sunspire Tree) ---
  adjectives_basics_q01_match_colors:
    minigame_id: word_matching
    instruction: "השלימו את האות החסרה במילה."
    tasks: [GREE_, _ED, BL_E]
    target: "green, red, blue"
    variant: missing_letter_matching
    success: "הצבעים הראשונים חזרו אל הציור."
    params:
      letters:
        - { id: adj_q01a_tile_e, value: e }
        - { id: adj_q01a_tile_u, value: u }
        - { id: adj_q01a_tile_g, value: g }
        - { id: adj_q01a_tile_r, value: r }
        - { id: adj_q01a_tile_n, value: n }
      wordTasks:
        - { id: adj_q01a_task_green, image: '', fullWord: green, missingIndices: [4] }
        - { id: adj_q01a_task_red, image: '', fullWord: red, missingIndices: [0] }
        - { id: adj_q01a_task_blue, image: '', fullWord: blue, missingIndices: [2] }

  adjectives_basics_q01_spell_red:
    minigame_id: letter_ordering
    instruction: "כתבו באנגלית את המילה שפירושה אדום."
    tasks: [r, e, d]
    target: red
    variant: word_spelling
    success: "נכון. זאת מילת תיאור של צבע."
    params:
      prompt: "כתבו באנגלית את המילה שפירושה אדום."
      targetWord: red
      extraDistractorCount: 2
      customDistractors: []

  adjectives_basics_q01_match_more_colors:
    minigame_id: word_matching
    instruction: "השלימו את האות החסרה במילה."
    tasks: [_ELLOW, BLU_, G_EEN]
    target: "yellow, blue, green"
    variant: missing_letter_matching
    success: "כל הצבעים בציור שלמים עכשיו."
    params:
      letters:
        - { id: adj_q01b_tile_o, value: o }
        - { id: adj_q01b_tile_r, value: r }
        - { id: adj_q01b_tile_l, value: l }
        - { id: adj_q01b_tile_y, value: y }
        - { id: adj_q01b_tile_e, value: e }
      wordTasks:
        - { id: adj_q01b_task_yellow, image: '', fullWord: yellow, missingIndices: [0] }
        - { id: adj_q01b_task_blue, image: '', fullWord: blue, missingIndices: [3] }
        - { id: adj_q01b_task_green, image: '', fullWord: green, missingIndices: [1] }

  adjectives_basics_q01_say_blue:
    minigame_id: speak_aloud
    instruction: "אמרו את המשפט הבא באנגלית בקול."
    tasks: [The, sky, is, blue]
    target: "The sky is blue."
    variant: single_word
    success: "השמיים בציור קיבלו את הצבע שלהם."
    params:
      prompt: "אמרו את המשפט הבא באנגלית בקול. משמעותו בעברית: השמיים כחולים."
      targetWords: [blue]
      targetPhrase: "The sky is blue."
      silenceTimeoutSeconds: 2.5
      allowFuzzyMatch: true
      referenceClip: ''

