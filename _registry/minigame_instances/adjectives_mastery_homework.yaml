# Homework for The Adjectives Mastery line (Maya's answer cards). One quest, no new rule: every task checks
# the adjective before the noun or a comparison with -er and than, in new sentences built from lesson words.
# Ladder: recognise what can stand before than (Dwarf Miner) -> spell bigger with its double g (Fruit Slice Letters)
# -> build a comparison (Word Ordering) -> build fast, adjective before the noun (Fruit Slice Words)
# -> the two-adjective order trap (Word Ordering) -> say a comparison (Speak Aloud, phrase mode like lesson q03).
# Traps: -er nouns (teacher, sister, water) and base adjectives (strong, dark, bright) in the mine - 5 targets, all
# required, so collecting every -er word or every adjective fails most runs; strong / more / weaker next to stronger;
# sharper next to a sharp sword; cleaner / brighter / dirty next to a clean and bright room (Hebrew puts the noun first).
instances:

  adjectives_mastery_homework_q01_mine_words_before_than:
    minigame_id: dwarf_miner
    instruction: "אספו רק מילים שיכולות לבוא לפני than."
    tasks: [stronger, darker, brighter, cleaner, sharper]
    target: "stronger, darker, brighter, cleaner, sharper"
    variant: word_category
    success: "נכון. לפני than באה רק מילת השוואה - שם תואר עם er."
    params:
      prompt: "אספו רק מילים שיכולות לבוא לפני than."
      categoryLabel: "___ than"
      targetWords: [stronger, darker, brighter, cleaner, sharper]
      distractorWords: [strong, dark, bright, teacher, sister, water]
      requiredCorrect: 5
      allowedMistakes: 3

  adjectives_mastery_homework_q01_spell_bigger:
    minigame_id: fruit_slice
    instruction: "חתכו את הפירות לפי הסדר וכתבו באנגלית את המילה שפירושה גדול יותר."
    tasks: [b, i, g, g, e, r]
    target: bigger
    variant: letter_slicing
    success: "נכון. ב־bigger כותבים את g פעמיים."
    params:
      prompt: "חתכו את הפירות לפי הסדר וכתבו באנגלית את המילה שפירושה גדול יותר."
      segmentation: Letters
      targetText: bigger
      preFilledIndices: []
      distractors: []
      extraLetterDistractorCount: 3

