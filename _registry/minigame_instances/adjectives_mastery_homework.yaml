    target: "Armor is stronger than a shirt."
    variant: sentence_building
    success: "נכון. חזק יותר זו מילה אחת באנגלית - stronger."
    params:
      prompt: "בנו את המשפט באנגלית לפי התרגום המלא בעברית: שריון חזק יותר מחולצה. סדרו את כל המילים."
      translation: "שריון חזק יותר מחולצה."
      englishWordsInOrder: [Armor, is, stronger, than, a, shirt]
      preFilledIndices: []
      distractorWords: [strong, more, weaker]

  adjectives_mastery_homework_q01_a_sharp_sword:
    minigame_id: fruit_slice
    instruction: "חתכו את הפירות לפי הסדר ובנו את המשפט באנגלית."
