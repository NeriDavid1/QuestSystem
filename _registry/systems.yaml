# Reusable quest step types — maps to Unity QuestObjectiveType.
# See unity_mapping.yaml for the full Unity ↔ YAML map.
# Canonical live pattern: reach_location → play_minigame → deliver_item

step_types:

  talk_to_npc:
    unity_objective: TalkToNpc
    description: Player initiates dialogue with an NPC
    fields:
      npc_id: { type: string, required: true, ref: npcs.yaml }
      dialogue_id: { type: string, required: true, ref: "_registry/dialogues/" }
      optional_flag: { type: string, required: false, description: "Sets a story flag after dialogue" }

  return_to_npc:
    unity_objective: TalkToNpc
    description: Player returns to an NPC to turn in or continue
    fields:
      npc_id: { type: string, required: true, ref: npcs.yaml }
      dialogue_id: { type: string, required: true, ref: "_registry/dialogues/" }

  play_minigame:
    unity_objective: CompleteMiniGame
    description: Start and complete a minigame on a world station
    fields:
      minigame_id: { type: string, required: true, ref: minigames.yaml, description: "One of the 5 Unity minigame types" }
      world_object_id: { type: string, required: true, ref: interactables.yaml, description: "Exact Open World station gameId (chest/cart/camp/table)" }
      difficulty: { type: integer, required: true, min: 1, max: 10 }
      success_required: { type: boolean, required: false, default: true }
      instance_id: { type: string, required: false, ref: "_registry/minigame_instances/", description: "Override auto key {quest_id}_s{step_index}" }
      reward_item_id: { type: string, required: false, ref: items.yaml, description: "SoftKitty inventory item granted after success (needs softkitty_id)" }
      reward_amount: { type: integer, required: false, min: 1, default: 1 }

  collect_item:
    unity_objective: Collect
    description: Gather items from the world or drops
    fields:
      item_id: { type: string, required: true, ref: items.yaml }
      amount: { type: integer, required: true, min: 1 }

  deliver_item:
    unity_objective: DeliverItem
    description: Bring items to an NPC (SoftKitty consume on live quests)
    fields:
      npc_id: { type: string, required: true, ref: npcs.yaml }
      item_id: { type: string, required: true, ref: items.yaml }
      amount: { type: integer, required: true, min: 1 }
      dialogue_id: { type: string, required: false, ref: "_registry/dialogues/" }

  reach_location:
    unity_objective: EnterArea
    description: Player must enter a trigger zone
    fields:
      location_id: { type: string, required: true, ref: areas.yaml, description: "Exact Unity area ID from AreaCatalog_OpenWorld" }
      radius: { type: float, required: false, default: 5.0 }

