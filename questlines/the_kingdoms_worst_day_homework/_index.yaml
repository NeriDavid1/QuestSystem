  display_name: "The Kingdom's Worst Day - שיעורי בית"
  theme: "Homework for The Kingdom's Worst Day line: no new words. On the evening after the fair, the wind mixes up the word cards on the fair's board by the gate. Fenn the guard asks the learner to pick out the verbs, put nouns, verbs and adjectives in their places, and rebuild short sentences alone before the gate closes for the night."
