quest:
  id: q06_dragon_identity
  name: "The Dragon Who Became a Goblin"
  level_required: 1
  giver_npc: Cannoneer
  prerequisite: q05_wizard_for_sale
  summary: "DRAGON, GRIFFIN, and GOBLIN get the wrong name cards — spell DRAGON, speak the three, deliver an Ancient Rune to the Cannoneer."
  wait_for_npc_turn_in: false

rewards: { xp: 650, items: [] }

steps:
  - type: talk_to_npc
    npc_id: Cannoneer
    dialogue_id: nouns_cannoneer_wrong_names

  - type: reach_location
    location_id: Forsaken Cove

  - type: play_minigame
    minigame_id: letter_ordering
    world_object_id: Lost_Chest3_Forsaken_Cove
    instance_id: q06_dragon_identity_s2
    difficulty: 6
    success_required: true

  - type: play_minigame
    minigame_id: speak_aloud
    world_object_id: Lost_Chest3_Forsaken_Cove
    instance_id: q06_dragon_identity_s3
    difficulty: 6
    success_required: true
    reward_item_id: ancient_rune
    reward_amount: 1

  - type: deliver_item
    npc_id: Cannoneer
    item_id: ancient_rune
    amount: 1
    dialogue_id: nouns_cannoneer_names_restored
    reward_item_id: ancient_rune
    reward_amount: 1
