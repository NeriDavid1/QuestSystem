quest:
  id: q07_royal_noun_trial
  name: "The Royal Noun Trial"
  level_required: 1
  giver_npc: teacher_maya
  prerequisite: q06_dragon_identity
  summary: "Review kingdom nouns — spell five key words, speak one from each group, deliver an Ancient Rune to Maya."

rewards:
  xp: 700
  items:
    - id: coin
      amount: 10

steps:
  - type: talk_to_npc
    npc_id: teacher_maya
    dialogue_id: nouns_maya_final_trial

  - type: reach_location
    location_id: Sanctum of Whispering Light

  - type: play_minigame
    minigame_id: letter_ordering
    world_object_id: Lost_Chest4_Sanctum_Of_Whispering_Light
    instance_id: q07_royal_noun_trial_s2
    difficulty: 6
    success_required: true

  - type: play_minigame
    minigame_id: speak_aloud
    world_object_id: Lost_Chest4_Sanctum_Of_Whispering_Light
    instance_id: q07_royal_noun_trial_s3
    difficulty: 7
    success_required: true
    reward_item_id: ancient_rune
    reward_amount: 1

  - type: deliver_item
    npc_id: teacher_maya
    item_id: ancient_rune
    amount: 1
    dialogue_id: nouns_maya_book_restored
    reward_item_id: ancient_rune
    reward_amount: 1
