    npc_id: teacher_maya
    dialogue_id: nouns_maya_missing_roles

  - type: reach_location
    location_id: SilverFountainCourt

  - type: play_minigame
    minigame_id: letter_ordering
    world_object_id: Lost_Chest5_Silver_Fountain_Court
    instance_id: q01_roles_without_names_s2
    difficulty: 4
    success_required: true

  - type: play_minigame
    minigame_id: speak_aloud
    world_object_id: Lost_Chest5_Silver_Fountain_Court
    instance_id: q01_roles_without_names_s3
    difficulty: 5
    success_required: true
    reward_item_id: gem
    reward_amount: 1

  - type: deliver_item
    npc_id: teacher_maya
    item_id: gem
    amount: 1
    dialogue_id: nouns_maya_roles_restored
    reward_item_id: gem
    reward_amount: 1
