quest:
  id: q04_soup_shield
  name: The Soup Shield
  level_required: 1
  giver_npc: Blacksmith
  prerequisite: q03_crown_soup
  summary: SWORD, SHIELD, and SCROLL are mixed in the forge — spell SHIELD, speak
    the three, deliver a Power Stone to Will.
  wait_for_npc_turn_in: false
rewards:
  xp: 550
  items: []
steps:
  - type: talk_to_npc
    npc_id: Blacksmith
    dialogue_id: nouns_blacksmith_mixed_equipment
  - type: reach_location
    location_id: The Oathstone Bridge
    display_text: Reach The Oathstone Bridge
  - type: play_minigame
    minigame_id: letter_ordering
    world_object_id: WoodenCart3_The_Oath_stone_Bridge
    difficulty: 5
    success_required: true
    instance_id: q04_soup_shield_s2
    display_text: סדרו את האותיות של SHIELD
  - type: play_minigame
    minigame_id: speak_aloud
    world_object_id: WoodenCart3_The_Oath_stone_Bridge
    difficulty: 6
    success_required: true
    instance_id: q04_soup_shield_s3
    reward_item_id: power_stone
    reward_amount: 1
    display_text: 'אמרו באנגלית: חרב, מגן ומגילה'
  - type: deliver_item
    npc_id: Blacksmith
    item_id: power_stone
    amount: 1
    dialogue_id: nouns_blacksmith_equipment_restored
    display_text: Deliver 1 power stone to Will
