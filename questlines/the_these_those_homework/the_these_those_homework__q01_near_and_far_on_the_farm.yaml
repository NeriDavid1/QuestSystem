quest:
  id: the_these_those_homework__q01_near_and_far_on_the_farm
  name: "Near and Far on the Farm"
  level_required: 50
  giver_npc: Farmer
  prerequisite: null
  summary: "ראש הכפר בא מחר לראות את החווה. הראו לחקלאי לבד שאתם זוכרים מתי אומרים The, מתי These ומתי Those."
  wait_for_npc_turn_in: true
  turn_in_dialogue_id: the_these_those_homework_q01_finish
rewards: { xp: 2000, items: [{ id: coin, amount: 360 }, { id: quest_loot_mid_finale, amount: 1 }] }
