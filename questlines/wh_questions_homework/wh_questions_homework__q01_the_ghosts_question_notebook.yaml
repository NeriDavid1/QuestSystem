  - type: play_minigame
    minigame_id: word_ordering
    world_object_id: Tomb_Stone_The_Weeping_Stones
    difficulty: 6
    success_required: true
    instance_id: wh_questions_homework_q01_why_are_you_sad
    display_text: בנו את השאלה באנגלית לפי התרגום המלא בעברית.
  - type: play_minigame
    minigame_id: speak_aloud
    world_object_id: Tomb_Stone_The_Weeping_Stones
    difficulty: 6
    success_required: true
    instance_id: wh_questions_homework_q01_say_who_is_your_teacher
    display_text: אמרו את השאלה הבאה באנגלית בקול.
