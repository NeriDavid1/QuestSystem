quest:
  id: wh_questions_homework__q01_the_ghosts_question_notebook
  name: "The Ghost's Question Notebook"
  level_required: 50
  giver_npc: Ghost
  prerequisite: null
  summary: "הרוח כותבת מחברת שאלות כדי שלא תשכח שוב. עזרו לה למלא אותה לבד, עם כל מילות השאלה."
  wait_for_npc_turn_in: true
  turn_in_dialogue_id: wh_questions_homework_q01_finish
rewards: { xp: 3350, items: [{ id: coin, amount: 605 }, { id: quest_loot_mid_finale, amount: 1 }] }
