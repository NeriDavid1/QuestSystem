    success_required: true
    instance_id: wh_questions_homework_q01_match_question_words
    display_text: השלימו את האות החסרה בכל מילת שאלה.
  - type: play_minigame
    minigame_id: word_ordering
    world_object_id: Tomb_Stone_The_Weeping_Stones
    difficulty: 5
    success_required: true
    instance_id: wh_questions_homework_q01_where_is_the_old_tower
    display_text: בנו את השאלה באנגלית לפי התרגום המלא בעברית.
  - type: play_minigame
    minigame_id: fruit_slice
    world_object_id: Tomb_Stone_The_Weeping_Stones
    difficulty: 5
    success_required: true
    instance_id: wh_questions_homework_q01_who_is_at_the_door
