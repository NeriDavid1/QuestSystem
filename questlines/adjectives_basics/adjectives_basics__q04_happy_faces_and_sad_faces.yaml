quest:
  id: adjectives_basics__q04_happy_faces_and_sad_faces
  name: "Happy Faces and Sad Faces"
  level_required: 1
  giver_npc: "Little Girl"
  prerequisite: adjectives_basics__q03_the_word_before_the_name
  summary: "בציור יש פנים בלי הבעה. למדו מילות תיאור של רגשות: happy, sad, angry, tired."
  wait_for_npc_turn_in: true
  turn_in_dialogue_id: adjectives_basics_q04_finish
rewards: { xp: 225, items: [] }
steps:
  - type: talk_to_npc
    npc_id: "Little Girl"
    dialogue_id: adjectives_basics_q04_start
  - type: play_minigame
    minigame_id: word_matching
    world_object_id: Exam_Table_Fairy_Rose_Park
    difficulty: 3
    success_required: true
    instance_id: adjectives_basics_q04_match_feelings
    display_text: השלימו את האות החסרה במילה.
  - type: play_minigame
    minigame_id: letter_ordering
    world_object_id: Exam_Table_Fairy_Rose_Park
    difficulty: 2
    success_required: true
    instance_id: adjectives_basics_q04_spell_happy
    display_text: כתבו באנגלית את המילה שפירושה שמח.
  - type: play_minigame
    minigame_id: letter_ordering
    world_object_id: Exam_Table_Fairy_Rose_Park
    difficulty: 2
    success_required: true
    instance_id: adjectives_basics_q04_spell_sad
    display_text: כתבו באנגלית את המילה שפירושה עצוב.
  - type: play_minigame
    minigame_id: speak_aloud
    world_object_id: Exam_Table_Fairy_Rose_Park
    difficulty: 5
    success_required: true
    instance_id: adjectives_basics_q04_say_tired_sentence
    display_text: אמרו את המשפט הבא באנגלית בקול.
