    display_text: כתבו באנגלית את המילה שפירושה אדום.
  - type: play_minigame
    minigame_id: word_matching
    world_object_id: Lost_Chest7_The_Sunspire_Tree
    difficulty: 2
    success_required: true
    instance_id: adjectives_basics_q01_match_more_colors
    display_text: השלימו את האות החסרה במילה.
  - type: play_minigame
    minigame_id: speak_aloud
    world_object_id: Lost_Chest7_The_Sunspire_Tree
