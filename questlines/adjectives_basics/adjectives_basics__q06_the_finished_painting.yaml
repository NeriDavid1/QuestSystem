quest:
  id: adjectives_basics__q06_the_finished_painting
  name: "The Finished Painting"
  level_required: 1
  giver_npc: Painter
  prerequisite: adjectives_basics__q05_the_tree_is_tall
  summary: "חזרה אל הצייר עם כל מילות התיאור שלמדתם. סיימו את הציור והביאו לצייר את אבן הצבעים."
  wait_for_npc_turn_in: true
  turn_in_dialogue_id: adjectives_basics_q06_finish
rewards:
  xp: 350
  items:
    - id: coin
      amount: 10
steps:
  - type: talk_to_npc
    npc_id: Painter
    dialogue_id: adjectives_basics_q06_start
  - type: play_minigame
    minigame_id: word_matching
    world_object_id: Lost_Chest7_The_Sunspire_Tree
    difficulty: 4
    success_required: true
    instance_id: adjectives_basics_q06_match_review
    display_text: השלימו את האות החסרה במילה.
  - type: play_minigame
    minigame_id: word_ordering
    world_object_id: Lost_Chest7_The_Sunspire_Tree
    difficulty: 5
    success_required: true
    instance_id: adjectives_basics_q06_big_yellow_sun
    display_text: בנו את התיאור באנגלית לפי התרגום המלא בעברית.
  - type: play_minigame
    minigame_id: letter_ordering
    world_object_id: Lost_Chest7_The_Sunspire_Tree
    difficulty: 3
    success_required: true
    instance_id: adjectives_basics_q06_spell_tired
    display_text: כתבו באנגלית את המילה שפירושה עייף.
  - type: play_minigame
    minigame_id: speak_aloud
    world_object_id: Lost_Chest7_The_Sunspire_Tree
    difficulty: 6
    success_required: true
    instance_id: adjectives_basics_q06_say_bird_sentence
    reward_item_id: gem
    reward_amount: 1
    display_text: אמרו את המשפט הבא באנגלית בקול.
  - type: deliver_item
    npc_id: Painter
    item_id: gem
    amount: 1
    display_text: הביאו לצייר את אבן הצבעים.
