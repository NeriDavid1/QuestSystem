quest:
  id: abc_k_keys
  name: המפתחות והעפיפון
  level_required: 0
  giver_npc: pip_bellringer
  prerequisite: abc_j_jars
  summary: ''
  wait_for_npc_turn_in: true
rewards:
  xp: 150
  items:
    - id: coin
      amount: 30
steps:
  - type: talk_to_npc
    npc_id: pip_bellringer
    dialogue_id: k_lesson
    count: 1
    display_text: דברו עם פיפ ליד הדלת הנעולה
  - type: custom
    handler_id: abc_k_chests
    unity_objective_index: 1
    count: 4
    reactor: task_set
    tasks:
      - index: 0
        name: KeyChest_1
        trigger: interact
        prompt: פתח את התיבה
        scene_minigame: LetterOrderingQuestConfig_nouns_festival_q03_monkey
        scene_minigame_id: letter_ordering
        mode: scene
      - index: 1
        name: KeyChest_2
        trigger: interact
        prompt: פתח את התיבה
        scene_minigame: LetterOrderingQuestConfig_the_kingdoms_worst_day__q01_key_spelling
        scene_minigame_id: letter_ordering
        mode: scene
      - index: 2
        name: KeyChest_3
        trigger: interact
        prompt: פתח את התיבה
        scene_minigame: WordOrderingQuestConfig_the_kingdoms_worst_day__q01_key_sentence
        scene_minigame_id: word_ordering
        mode: scene
      - index: 3
        name: KeyChest_4
        trigger: interact
        prompt: פתח את התיבה
        scene_minigame: WordOrderingQuestConfig_the_kingdoms_worst_day_homework_q01_small_key_big_gate
        scene_minigame_id: word_ordering
        mode: scene
    display_text: פתחו את התיבות בכפר
  - type: custom
    handler_id: abc_k_trap
    unity_objective_index: 2
    count: 1
    reactor: task_set
    tasks:
      - index: 0
        name: TrapChest
        trigger: interact
        prompt: פתח
        scene_no_minigame: true
        mode: scene
    display_text: פתחו את התיבה האחרונה
  - type: custom
    handler_id: abc_k_mimic
    unity_objective_index: 3
    count: 1
    reactor: monster_encounter
    display_text: הביסו את המימיק
  - type: custom
    handler_id: abc_k_kite
    unity_objective_index: 4
    count: 2
    reactor: task_set
    tasks:
      - index: 0
        name: KiteFrame
        trigger: interact
        prompt: בנה את המסגרת
        scene_minigame: WordOrderingQuestConfig_noun_repair_q06_sentence
        scene_minigame_id: word_ordering
        mode: scene
      - index: 1
        name: KiteSail
        trigger: interact
        prompt: מתח את הבד
        scene_minigame: WordOrderingQuestConfig_numbers_q03_sentence_seven_hundred_twenty
        scene_minigame_id: word_ordering
        mode: scene
    display_text: בנו עפיפון עם פיפ
  - type: custom
    handler_id: abc_k_fly
    unity_objective_index: 5
    count: 1
    reactor: task_set
    tasks:
      - index: 0
        name: FlyKite
        trigger: interact
        prompt: הטס את העפיפון
        scene_minigame: WordOrderingQuestConfig_line_msysmv9a_q02_farmer_minigame
        scene_minigame_id: word_ordering
        mode: scene
    display_text: הטיסו את העפיפון לרכס והורידו את המפתח האחרון
  - type: custom
    handler_id: abc_k_doors
    unity_objective_index: 6
    count: 3
    reactor: task_set
    tasks:
      - index: 0
        name: Door_Mira
        trigger: interact
        prompt: פתח את הדלת
        scene_no_minigame: true
        mode: scene
      - index: 1
        name: Door_Chapel
        trigger: interact
        prompt: פתח את הדלת
        scene_no_minigame: true
        mode: scene
      - index: 2
        name: Door_Bruno
        trigger: interact
        prompt: פתח את הדלת
        scene_no_minigame: true
        mode: scene
    display_text: פתחו את שלוש הדלתות
  - type: return_to_npc
    npc_id: pip_bellringer
    dialogue_id: k_turnin
