    reactor: task_set
    tasks:
      - index: 0
        name: Lantern_1
        trigger: interact
        prompt: הדלק את הפנס
        scene_minigame: LetterOrderingQuestConfig_nouns_festival_q02_candle
        scene_minigame_id: letter_ordering
        mode: scene
      - index: 1
        name: Lantern_2
        trigger: interact
        prompt: הדלק את הפנס
        scene_minigame: WordOrderingQuestConfig_q02_cat_small
        scene_minigame_id: word_ordering
        mode: scene
      - index: 2
        name: Lantern_3
        trigger: interact
        prompt: הדלק את הפנס
        scene_minigame: LineMatchQuestConfig_adjectives_basics_q01_match_more_colors
        scene_minigame_id: word_matching
        mode: scene
      - index: 3
        name: Lantern_4
        trigger: interact
        prompt: הדלק את הפנס
        scene_minigame: FruitSliceQuestConfig_adjectives_basics_homework_q01_a_tall_green_tree
