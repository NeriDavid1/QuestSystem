        scene_minigame: LineMatchQuestConfig_adjectives_basics_q03_match_sign_words
        scene_minigame_id: word_matching
        mode: scene
    display_text: הדליקו את הנר הגדול יחד עם נועה
  - type: return_to_npc
    npc_id: noa
    dialogue_id: c_turnin
