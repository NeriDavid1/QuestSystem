quest:
  id: abc_t_treehouse
  name: בית העץ
  level_required: 0
  giver_npc: bruno_gardener
  prerequisite: abc_fun5_sleds
  summary: ''
  wait_for_npc_turn_in: true
rewards:
  xp: 150
  items:
    - id: coin
      amount: 30
steps:
  - type: talk_to_npc
    npc_id: bruno_gardener
    dialogue_id: t_lesson
    count: 1
    display_text: דברו עם ברונו מתחת לעץ הגדול
  - type: custom
    handler_id: abc_t_parts
    unity_objective_index: 1
    count: 5
    reactor: task_set
    tasks:
      - index: 0
        name: Part_Planks
        trigger: interact
        prompt: הרם את קרשי הרצפה
        scene_minigame: DwarfMinerQuestConfig_abc_valley__abc_g_tree__o1_t0
        scene_minigame_id: dwarf_miner
        mode: minigame
        minigame_id: dwarf_miner
        instance_key: abc_valley__abc_t_treehouse__o1_t0
      - index: 1
        name: Part_RopeLadder
        trigger: interact
        prompt: קח את סולם החבלים
        scene_minigame: WordOrderingQuestConfig_articles_a_an_q06_fish_and_octopus
        scene_minigame_id: word_ordering
        mode: minigame
        minigame_id: listening_letter_ordering
        instance_key: abc_valley__abc_t_treehouse__o1_t1
      - index: 2
        name: Part_RoundWindow
        trigger: interact
        prompt: קח את החלון העגול
        scene_minigame: WordOrderingQuestConfig_missing_verbs_q01_sentence_open
        scene_minigame_id: word_ordering
        mode: minigame
        minigame_id: letter_drawing
        instance_key: abc_valley__abc_t_treehouse__o1_t2
      - index: 3
        name: Part_RedRoof
        trigger: interact
        prompt: קח את הגג האדום
        scene_minigame: LetterOrderingQuestConfig_abc_valley__abc_g_tree__o1_t5
        scene_minigame_id: letter_ordering
        mode: minigame
        minigame_id: word_matching
        instance_key: abc_valley__abc_t_treehouse__o1_t3
      - index: 4
        name: Part_Flag
        trigger: interact
        prompt: קח את הדגל
        scene_minigame: LineMatchQuestConfig_abc_valley__abc_g_tree__o1_t3
        scene_minigame_id: word_matching
        mode: minigame
        minigame_id: listening_letter_ordering
        instance_key: abc_valley__abc_t_treehouse__o1_t4
    display_text: מצאו את חלקי בית העץ והחזירו אותם לעץ
  - type: custom
    handler_id: abc_t_climb
    unity_objective_index: 2
    count: 1
    reactor: task_set
    tasks:
      - index: 0
        name: IntoTheHouse
        trigger: enter_area
        scene_no_minigame: true
        mode: scene
    display_text: טפסו בסולם החבלים לבית העץ
  - type: custom
    handler_id: abc_t_telescope
    unity_objective_index: 3
    count: 1
    reactor: task_set
    tasks:
      - index: 0
        name: Telescope
        trigger: interact
        prompt: כוון את הטלסקופ לשמיים
        scene_minigame: WordOrderingQuestConfig_this_or_that_homework_q01_the_letter_on_this_table
        scene_minigame_id: word_ordering
        mode: minigame
        minigame_id: listening_letter_ordering
        instance_key: abc_valley__abc_t_treehouse__o3_t0
    display_text: כוונו את הטלסקופ לשמיים
  - type: custom
    handler_id: abc_t_zip
    unity_objective_index: 4
    count: 1
    reactor: task_set
    tasks:
      - index: 0
        name: ZiplineStart
        trigger: interact
        prompt: גלוש באומגה
        intercepted: true
        scene_no_minigame: true
        mode: scene
    display_text: גלשו באומגה אל הבריכה
  - type: return_to_npc
    npc_id: bruno_gardener
    dialogue_id: t_turnin
