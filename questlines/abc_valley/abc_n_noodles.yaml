quest:
  id: abc_n_noodles
  name: הנודלס של ברונו
  level_required: 0
  giver_npc: bruno_gardener
  prerequisite: abc_m_museum
  summary: ''
  wait_for_npc_turn_in: true
rewards:
  xp: 150
  items:
    - id: coin
      amount: 30
steps:
  - type: talk_to_npc
    npc_id: bruno_gardener
    dialogue_id: n_lesson
    count: 1
    display_text: דברו עם ברונו במטבח
  - type: custom
    handler_id: abc_n_find
    unity_objective_index: 1
    count: 5
    reactor: task_set
    tasks:
      - index: 0
        name: Ingredient_Onion
        trigger: interact
        prompt: תפוס את הבצל
        scene_minigame: DwarfMinerQuestConfig_verbs_to_be_homework_q01_mine_are_words
        scene_minigame_id: dwarf_miner
        mode: minigame
        minigame_id: dwarf_miner
        instance_key: abc_valley__abc_n_noodles__o1_t0
      - index: 1
        name: Ingredient_Spices
        trigger: interact
        prompt: קח את התבלינים
        scene_minigame: LetterOrderingQuestConfig_adjectives_basics_q06_spell_tired
        scene_minigame_id: letter_ordering
        mode: minigame
        minigame_id: listening_letter_ordering
        instance_key: abc_valley__abc_n_noodles__o1_t1
      - index: 2
        name: Ingredient_Egg
        trigger: interact
        prompt: קח ביצה מהלול
        scene_minigame: LineMatchQuestConfig_articles_a_an_q06_match_review
        scene_minigame_id: word_matching
        mode: minigame
        minigame_id: letter_drawing
        instance_key: abc_valley__abc_n_noodles__o1_t2
      - index: 3
        name: Ingredient_Vegetables
        trigger: interact
        prompt: קטוף ירקות
        scene_minigame: WordOrderingQuestConfig_missing_verbs_q01_sentence_open
        scene_minigame_id: word_ordering
        mode: minigame
        minigame_id: listening_letter_ordering
        instance_key: abc_valley__abc_n_noodles__o1_t3
      - index: 4
        name: Ingredient_Water
        trigger: interact
        prompt: שאב מים מהבאר
        scene_minigame: WordOrderingQuestConfig_noun_repair_q05_sentence
        scene_minigame_id: word_ordering
        mode: none
    display_text: מצאו את המצרכים שהתחבאו בבתים
  - type: custom
    handler_id: abc_n_stir
    unity_objective_index: 2
    count: 1
    reactor: task_set
    tasks:
      - index: 0
        name: Stir
        trigger: interact
        prompt: בחש את הסיר
        scene_minigame: LetterOrderingQuestConfig_line_msysmv9a_q03_little_girl_minigame
        scene_minigame_id: letter_ordering
        mode: minigame
        minigame_id: listening_letter_ordering
        instance_key: abc_valley__abc_n_noodles__o2_t0
    display_text: בחשו את הסיר הענק עם ברונו
  - type: custom
    handler_id: abc_n_feast
    unity_objective_index: 3
    count: 1
    reactor: task_set
    tasks:
      - index: 0
        name: Sit
        trigger: enter_area
        scene_no_minigame: true
        mode: scene
    display_text: שבו לשולחן הארוך בכיכר
  - type: return_to_npc
    npc_id: bruno_gardener
    dialogue_id: n_turnin
