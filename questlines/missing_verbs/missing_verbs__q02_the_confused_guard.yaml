quest:
  id: missing_verbs__q02_the_confused_guard
  name: "The Confused Guard"
  level_required: 1
  giver_npc: "Main Gate Gaurd 1"
  prerequisite: missing_verbs__q01_benny_can_t_build_verbs
  summary: "עזרו לשומר להבין את פעלי הפעולה בפקודות המלך."
  wait_for_npc_turn_in: false
rewards: { xp: 100, items: [{ id: coin, amount: 10 }] }
steps:
  - type: talk_to_npc
    npc_id: "Main Gate Gaurd 1"
    dialogue_id: missing_verbs_q02_start
  - type: play_minigame
    minigame_id: word_matching
    world_object_id: Exam_Table1_Outside_Gate
    difficulty: 2
    success_required: true
    instance_id: missing_verbs_q02_match_commands
    display_text: השלימו את האות החסרה בכל פועל פעולה.
  - type: play_minigame
    minigame_id: letter_ordering
    world_object_id: Exam_Table1_Outside_Gate
    difficulty: 2
    success_required: true
    instance_id: missing_verbs_q02_spell_open
    display_text: כתבו באנגלית את המילה שפירושה לפתוח.
  - type: play_minigame
    minigame_id: speak_aloud
    world_object_id: Exam_Table1_Outside_Gate
    difficulty: 3
    success_required: true
    instance_id: missing_verbs_q02_say_find
    display_text: אמרו את המילה הבאה באנגלית בקול.
  - type: play_minigame
    minigame_id: word_ordering
    world_object_id: Exam_Table1_Outside_Gate
    difficulty: 3
    success_required: true
    instance_id: missing_verbs_q02_sentence_jump
    display_text: השלימו את המשפט לפי התרגום בעברית.
  - type: return_to_npc
    npc_id: "Main Gate Gaurd 1"
    dialogue_id: missing_verbs_q02_finish
    success_required: true
    display_text: חזרו לשומר לסיום המשימה.
