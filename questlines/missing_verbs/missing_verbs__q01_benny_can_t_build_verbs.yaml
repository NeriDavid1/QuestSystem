quest:
  id: missing_verbs__q01_benny_can_t_build_verbs
  name: "Benny Can't Build"
  level_required: 1
  giver_npc: "Benny the Builder"
  prerequisite: null
  summary: "עזרו לבני להחזיר פעלים לפקודות הבנייה."
  wait_for_npc_turn_in: false
rewards: { xp: 100, items: [{ id: coin, amount: 20 }] }
steps:
  - type: talk_to_npc
    npc_id: "Benny the Builder"
    dialogue_id: missing_verbs_q01_start
  - type: play_minigame
    minigame_id: letter_ordering
    world_object_id: Lost_Chest1_BuildersHomeArea
    difficulty: 1
    success_required: true
    instance_id: missing_verbs_q01_spell_build
    display_text: כתבו באנגלית את המילה שפירושה לבנות.
  - type: play_minigame
    minigame_id: word_ordering
    world_object_id: Lost_Chest1_BuildersHomeArea
    difficulty: 2
    success_required: true
    instance_id: missing_verbs_q01_sentence_open
    display_text: 'השלימו את המשפט לפי התרגום המלא בעברית: "אני צריך לפתוח אותו." בחרו את המילה החסרה לפי המשפט.'
  - type: play_minigame
    minigame_id: word_matching
    world_object_id: Lost_Chest1_BuildersHomeArea
    difficulty: 2
    success_required: true
    instance_id: missing_verbs_q01_match_actions
    display_text: השלימו את האות החסרה בכל פועל פעולה.
  - type: play_minigame
    minigame_id: speak_aloud
    world_object_id: Lost_Chest1_BuildersHomeArea
    difficulty: 3
    success_required: true
    instance_id: missing_verbs_q01_say_help
    display_text: אמרו את המילה הבאה באנגלית בקול.
  - type: return_to_npc
    npc_id: "Benny the Builder"
    dialogue_id: missing_verbs_q01_finish
    success_required: true
    display_text: חזרו לבני לסיום המשימה.
