    name: "The Fisherman With No Net"
    level: 50
    prerequisite: null
    rewards: { xp: 6200, items: [] }
  - id: articles_a_an__q02_the_twin_fish
    name: "The Twin Fish"
    level: 1
    prerequisite: articles_a_an__q01_the_fisherman_with_no_net
    rewards: { xp: 7750, items: [] }
  - id: articles_a_an__q03_the_mixed_up_market
