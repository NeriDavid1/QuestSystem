quest:
  id: articles_a_an__q06_the_net_of_little_words
  name: "The Net of Little Words"
  level_required: 1
  giver_npc: Fisherman
  prerequisite: articles_a_an__q05_the_tricky_word_in_the_middle
  summary: "נמו אורג את הרשת שלא נקרעת. השתמשו בכל מה שלמדתם על a ו־an, והביאו לו את אבן החן של מלכת הים."
  wait_for_npc_turn_in: true
  turn_in_dialogue_id: articles_a_an_q06_finish
rewards:
  xp: 350
  items: 
    - id: coin
      amount: 10
steps:
  - type: talk_to_npc
    npc_id: Fisherman
    dialogue_id: articles_a_an_q06_start
  - type: play_minigame
    minigame_id: word_ordering
    world_object_id: Lost_Chest2_Driftgold_Bay
    difficulty: 6
    success_required: true
    instance_id: articles_a_an_q06_fish_and_eel
    display_text: השלימו את המשפט לפי התרגום המלא בעברית.
  - type: play_minigame
    minigame_id: word_matching
    world_object_id: Lost_Chest2_Driftgold_Bay
    difficulty: 4
    success_required: true
    instance_id: articles_a_an_q06_match_review
    display_text: השלימו את האות החסרה במילה.
  - type: play_minigame
    minigame_id: letter_ordering
    world_object_id: Lost_Chest2_Driftgold_Bay
    difficulty: 4
    success_required: true
    instance_id: articles_a_an_q06_spell_island
    display_text: כתבו באנגלית את המילה שפירושה אי.
  - type: play_minigame
    minigame_id: speak_aloud
    world_object_id: Lost_Chest2_Driftgold_Bay
    difficulty: 7
    success_required: true
    instance_id: articles_a_an_q06_say_eel_in_net
    reward_item_id: gem
    reward_amount: 1
    display_text: אמרו את המשפט הבא באנגלית בקול.
  - type: deliver_item
    npc_id: Fisherman
    item_id: gem
    amount: 1
    display_text: הביאו לנמו את אבן החן של מלכת הים.
