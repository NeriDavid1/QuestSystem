quest:
  id: noun_repair_shop_homework__q01_the_box_of_broken_tags
  name: "The Box of Broken Tags"
  level_required: 50
  giver_npc: teacher_maya
  prerequisite: null
  summary: "לחנות של מאיה הגיעה קופסה מלאה בתוויות שבורות. תקנו אותן לבד והראו לה שאתם זוכרים את שמות העצם."
  wait_for_npc_turn_in: true
  turn_in_dialogue_id: noun_repair_shop_homework_q01_finish
rewards: { xp: 400, items: [{ id: coin, amount: 70 }, { id: quest_loot_early_finale, amount: 1 }] }
steps:
  - type: talk_to_npc
    npc_id: teacher_maya
    dialogue_id: noun_repair_shop_homework_q01_start
  - type: play_minigame
    minigame_id: dwarf_miner
    world_object_id: Exam_Table_Fairy_Rose_Park
    difficulty: 3
    success_required: true
    instance_id: noun_repair_shop_homework_q01_mine_the_nouns
    display_text: אספו רק את המילים שהן שמות עצם.
  - type: play_minigame
    minigame_id: word_matching
    world_object_id: Exam_Table_Fairy_Rose_Park
    difficulty: 4
    success_required: true
    instance_id: noun_repair_shop_homework_q01_fix_missing_letters
    display_text: השלימו את האות החסרה בכל שם עצם.
  - type: play_minigame
    minigame_id: letter_ordering
    world_object_id: Exam_Table_Fairy_Rose_Park
    difficulty: 4
    success_required: true
    instance_id: noun_repair_shop_homework_q01_spell_chair
    display_text: כתבו באנגלית את המילה שפירושה כיסא.
  - type: play_minigame
    minigame_id: word_ordering
    world_object_id: Exam_Table_Fairy_Rose_Park
    difficulty: 5
    success_required: true
    instance_id: noun_repair_shop_homework_q01_the_baker_holds_a_cake
    display_text: בנו את המשפט באנגלית לפי התרגום המלא בעברית.
  - type: play_minigame
    minigame_id: fruit_slice
    world_object_id: Exam_Table_Fairy_Rose_Park
    difficulty: 5
    success_required: true
    instance_id: noun_repair_shop_homework_q01_the_queen_has_a_crown
    display_text: חתכו את הפירות לפי הסדר ובנו את המשפט באנגלית.
  - type: play_minigame
    minigame_id: speak_aloud
    world_object_id: Exam_Table_Fairy_Rose_Park
    difficulty: 6
    success_required: true
    instance_id: noun_repair_shop_homework_q01_say_a_bird_is_on_the_tower
    display_text: אמרו את המשפט הבא באנגלית בקול.
