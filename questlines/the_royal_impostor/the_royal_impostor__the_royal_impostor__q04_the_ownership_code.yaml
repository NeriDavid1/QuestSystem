    display_text: "כתבו באנגלית את המילה שמתאימה לדבר של הציירת."
    world_object_id: Wooden_Cart1_Inside_Gate
    success_required: true

  - type: play_minigame
    difficulty: 8
    instance_id: the_royal_impostor__q04_his_her_checkpoint
    minigame_id: word_ordering
    display_text: "השלימו את הקוד של ויל והציירת."
    world_object_id: Exam_Table1_Outside_Gate
    success_required: true

  - type: return_to_npc
    npc_id: Blacksmith
    dialogue_id: the_royal_impostor_q04_fenn_done
