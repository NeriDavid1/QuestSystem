  giver_npc: Painter
  prerequisite: the_royal_impostor__the_royal_impostor__q02_the_witnesses
  summary: "השלימו את המילים שנקרעו מהסיפור והשתמשו בהן בשני משפטים."
  wait_for_npc_turn_in: false

rewards: { xp: 250, items: [] }

steps:
