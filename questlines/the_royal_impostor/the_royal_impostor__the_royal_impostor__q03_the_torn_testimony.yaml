    difficulty: 7
    instance_id: the_royal_impostor__q03_his_her_evidence
    minigame_id: word_ordering
    display_text: "השלימו את המשפט על ויל ועל הציירת."
    world_object_id: Wooden_Cart1_Inside_Gate
    success_required: true

  - type: play_minigame
    difficulty: 7
    instance_id: the_royal_impostor__q03_our_their_evidence
    minigame_id: word_ordering
    display_text: "השלימו את המשפט על השומרים ועל ארוחת הצהריים."
    world_object_id: Wooden_Cart1_Inside_Gate
    success_required: true

  - type: return_to_npc
    npc_id: Painter
    dialogue_id: the_royal_impostor_q03_fenn_done
