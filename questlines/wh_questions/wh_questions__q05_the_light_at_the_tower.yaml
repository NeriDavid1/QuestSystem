    minigame_id: word_ordering
    world_object_id: Fire_Camp_Tower_Of_Lost_Vigil
    difficulty: 5
    success_required: true
    instance_id: wh_questions_q05_ask_ghost
    display_text: השלימו את השאלה לפי התרגום המלא בעברית.
  - type: play_minigame
    minigame_id: word_ordering
    world_object_id: Fire_Camp_Tower_Of_Lost_Vigil
    difficulty: 5
    success_required: true
    instance_id: wh_questions_q05_ask_reason
    display_text: השלימו את השאלה לפי התרגום המלא בעברית.
