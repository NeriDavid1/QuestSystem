  - type: play_minigame
    minigame_id: speak_aloud
    world_object_id: Fire_Camp_Tower_Of_Lost_Vigil
    difficulty: 7
    success_required: true
    instance_id: wh_questions_q05_say_name_question
    display_text: אמרו את השאלה הבאה באנגלית בקול.
  - type: play_minigame
    minigame_id: speak_aloud
    world_object_id: Fire_Camp_Tower_Of_Lost_Vigil
    difficulty: 7
