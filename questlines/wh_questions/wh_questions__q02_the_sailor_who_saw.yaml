quest:
  id: wh_questions__q02_the_sailor_who_saw
  name: "The Sailor Who Saw"
  level_required: 1
  giver_npc: Fisherman
  prerequisite: wh_questions__q01_the_forgotten_name
  summary: "דייג במפרץ ראה משהו בלילה. שאלו Who ו-When כדי לדעת מי הייתה שם ומתי."
  wait_for_npc_turn_in: false
rewards: { xp: 175, items: [] }
steps:
  - type: talk_to_npc
    npc_id: Fisherman
    dialogue_id: wh_questions_q02_start
  - type: play_minigame
    minigame_id: word_ordering
    world_object_id: Lost_Chest2_Driftgold_Bay
    difficulty: 3
    success_required: true
    instance_id: wh_questions_q02_ask_sailor
    display_text: השלימו את השאלה לפי התרגום המלא בעברית.
  - type: play_minigame
    minigame_id: letter_ordering
    world_object_id: Lost_Chest2_Driftgold_Bay
    difficulty: 2
    success_required: true
    instance_id: wh_questions_q02_spell_when
    display_text: כתבו באנגלית את מילת השאלה שפירושה מתי.
  - type: play_minigame
    minigame_id: word_matching
    world_object_id: Lost_Chest2_Driftgold_Bay
    difficulty: 3
    success_required: true
    instance_id: wh_questions_q02_match_witness_words
    display_text: השלימו את האות החסרה בכל מילת שאלה.
  - type: play_minigame
    minigame_id: word_ordering
    world_object_id: Lost_Chest2_Driftgold_Bay
    difficulty: 3
    success_required: true
    instance_id: wh_questions_q02_ask_storm
    display_text: השלימו את השאלה לפי התרגום המלא בעברית.
  - type: play_minigame
    minigame_id: speak_aloud
    world_object_id: Lost_Chest2_Driftgold_Bay
    difficulty: 6
    success_required: true
    instance_id: wh_questions_q02_say_who
    display_text: אמרו את השאלה הבאה באנגלית בקול.
  - type: return_to_npc
    npc_id: Fisherman
    dialogue_id: wh_questions_q02_finish
    success_required: true
    display_text: חזרו לנמו עם עדות המלח.
