quest:
  id: personal_pronouns__q02_two_actors_one_name
  name: "Two Actors, One Name"
  level_required: 1
  giver_npc: Little Boy
  prerequisite: personal_pronouns__q01_the_notebook_ran_out
  summary: "בתמונה השנייה במחזה יש זמר ורקדנית, והשמות שלהם כתובים שבע עשרה פעמים. למדו מתי אומרים He ומתי אומרים She."
  wait_for_npc_turn_in: false
rewards: { xp: 175, items: [] }
steps:
  - type: talk_to_npc
    npc_id: Little Boy
    dialogue_id: personal_pronouns_q02_start
  - type: play_minigame
    minigame_id: word_ordering
    world_object_id: Exam_Table_Fairy_Rose_Park
    difficulty: 3
    success_required: true
    instance_id: personal_pronouns_q02_line_singer
    display_text: השלימו את המשפט לפי התרגום המלא בעברית.
  - type: play_minigame
    minigame_id: letter_ordering
    world_object_id: Exam_Table_Fairy_Rose_Park
    difficulty: 2
    success_required: true
    instance_id: personal_pronouns_q02_spell_she
    display_text: כתבו באנגלית את המילה שפירושה היא.
  - type: play_minigame
    minigame_id: word_matching
    world_object_id: Exam_Table_Fairy_Rose_Park
    difficulty: 2
    success_required: true
    instance_id: personal_pronouns_q02_match_he_she_you
    display_text: השלימו את האות החסרה בכל כינוי גוף.
  - type: play_minigame
    minigame_id: word_ordering
    world_object_id: Exam_Table_Fairy_Rose_Park
    difficulty: 3
    success_required: true
    instance_id: personal_pronouns_q02_line_dancer
    display_text: השלימו את המשפט לפי התרגום המלא בעברית.
  - type: play_minigame
    minigame_id: speak_aloud
    world_object_id: Exam_Table_Fairy_Rose_Park
    difficulty: 6
    success_required: true
    instance_id: personal_pronouns_q02_say_he_is_my_best_friend
    display_text: אמרו בקול את המשפט המלא באנגלית.
  - type: return_to_npc
    npc_id: Little Boy
    dialogue_id: personal_pronouns_q02_finish
    success_required: true
    display_text: חזרו לילד הקטן עם התמונה השנייה.
