quest:
  id: personal_pronouns__q01_the_notebook_ran_out
  name: "The Notebook Ran Out"
  level_required: 50
  giver_npc: Village Head
  prerequisite: null
  summary: "הילד הקטן כתב כל שם במחזה שוב ושוב והדפים נגמרו. למדו את המילים הקצרות I ו-You שיכולות לבוא במקום שם."
  wait_for_npc_turn_in: false
rewards: { xp: 150, items: [] }
steps:
  - type: talk_to_npc
    npc_id: Village Head
    dialogue_id: personal_pronouns_q01_start
  - type: play_minigame
    minigame_id: word_matching
    world_object_id: Exam_Table_Fairy_Rose_Park
    difficulty: 2
    success_required: true
    instance_id: personal_pronouns_q01_match_small_words
    display_text: השלימו את האות החסרה בכל מילה.
  - type: play_minigame
    minigame_id: word_ordering
    world_object_id: Exam_Table_Fairy_Rose_Park
    difficulty: 3
    success_required: true
    instance_id: personal_pronouns_q01_line_king
    display_text: השלימו את המשפט לפי התרגום המלא בעברית.
  - type: play_minigame
    minigame_id: letter_ordering
    world_object_id: Exam_Table_Fairy_Rose_Park
    difficulty: 2
    success_required: true
    instance_id: personal_pronouns_q01_spell_you
    display_text: כתבו באנגלית את המילה שפירושה אתה או את.
  - type: play_minigame
    minigame_id: word_ordering
    world_object_id: Exam_Table_Fairy_Rose_Park
    difficulty: 3
    success_required: true
    instance_id: personal_pronouns_q01_line_friend
    display_text: השלימו את המשפט לפי התרגום המלא בעברית.
  - type: play_minigame
    minigame_id: speak_aloud
    world_object_id: Exam_Table_Fairy_Rose_Park
    difficulty: 6
    success_required: true
    instance_id: personal_pronouns_q01_say_i_am_the_king
    display_text: אמרו בקול את המשפט המלא באנגלית.
  - type: return_to_npc
    npc_id: Village Head
    dialogue_id: personal_pronouns_q01_finish
    success_required: true
    display_text: חזרו לראש הכפר עם התמונה הראשונה.
