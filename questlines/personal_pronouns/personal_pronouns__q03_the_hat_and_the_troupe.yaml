quest:
  id: personal_pronouns__q03_the_hat_and_the_troupe
  name: "The Hat and the Whole Troupe"
  level_required: 1
  giver_npc: Village Head
  prerequisite: personal_pronouns__q02_two_actors_one_name
  summary: "לאביזרים של ההצגה אין שמות, וללהקה כולה צריך מילה אחת. למדו It לחפץ או לבעל חיים, ו-We לקבוצה שאני חלק ממנה."
  wait_for_npc_turn_in: false
rewards: { xp: 200, items: [] }
steps:
  - type: talk_to_npc
    npc_id: Village Head
    dialogue_id: personal_pronouns_q03_start
  - type: play_minigame
    minigame_id: letter_ordering
    world_object_id: Exam_Table_Fairy_Rose_Park
    difficulty: 2
    success_required: true
    instance_id: personal_pronouns_q03_spell_it
    display_text: כתבו באנגלית את המילה שאומרים על חפץ או על בעל חיים.
  - type: play_minigame
    minigame_id: word_ordering
    world_object_id: Exam_Table_Fairy_Rose_Park
    difficulty: 3
    success_required: true
    instance_id: personal_pronouns_q03_line_hat
    display_text: השלימו את המשפט לפי התרגום המלא בעברית.
  - type: play_minigame
    minigame_id: word_matching
    world_object_id: Exam_Table_Fairy_Rose_Park
    difficulty: 3
    success_required: true
    instance_id: personal_pronouns_q03_match_it_we_she_he
    display_text: השלימו את האות החסרה בכל כינוי גוף.
  - type: play_minigame
    minigame_id: word_ordering
    world_object_id: Exam_Table_Fairy_Rose_Park
    difficulty: 3
    success_required: true
    instance_id: personal_pronouns_q03_line_actors
    display_text: השלימו את המשפט לפי התרגום המלא בעברית.
  - type: play_minigame
    minigame_id: speak_aloud
    world_object_id: Exam_Table_Fairy_Rose_Park
    difficulty: 6
    success_required: true
    instance_id: personal_pronouns_q03_say_we_are_on_the_stage
    display_text: אמרו בקול את המשפט המלא באנגלית.
  - type: return_to_npc
    npc_id: Village Head
    dialogue_id: personal_pronouns_q03_finish
    success_required: true
    display_text: חזרו לראש הכפר עם רשימת האביזרים.
