quest:
  id: q05_the_castle_label_crisis
  name: "The Castle Label Crisis"
  level_required: 1
  giver_npc: Professor Crazy
  prerequisite: q04_the_kitchen_invasion
  summary: "Professor Crazy מצא תוויות לא נכונות בארמון. תקנו את ה־nouns לפני שהכתר יקבל שפם."
  wait_for_npc_turn_in: false
rewards: { xp: 250, items: [] }
steps:
  - type: talk_to_npc
    npc_id: Professor Crazy
    dialogue_id: noun_repair_q05_start
  - type: play_minigame
    minigame_id: word_matching
    world_object_id: WoodenCart2_Solitude_Tower
    difficulty: 3
    success_required: true
    instance_id: noun_repair_q05_castle
    display_text: "השלימו: _ASTLE / _OWER / _HRONE / _ROWN"
  - type: play_minigame
    minigame_id: letter_ordering
    world_object_id: WoodenCart2_Solitude_Tower
    difficulty: 3
    success_required: true
    instance_id: noun_repair_q05_treasure
    display_text: "סדרו את האותיות של TREASURE"
  - type: play_minigame
    minigame_id: word_matching
    world_object_id: WoodenCart2_Solitude_Tower
    difficulty: 3
    success_required: true
    instance_id: noun_repair_q05_roles
    display_text: "השלימו: _ING / _UEEN / _NIGHT / _UARD"
  - type: play_minigame
    minigame_id: word_ordering
    world_object_id: WoodenCart2_Solitude_Tower
    difficulty: 3
    success_required: true
    instance_id: noun_repair_q05_sentence
    display_text: "בנו משפט: The queen sits on the throne"
  - type: play_minigame
    minigame_id: word_matching
    world_object_id: WoodenCart2_Solitude_Tower
    difficulty: 3
    success_required: true
    instance_id: noun_repair_q05_objects
    display_text: "השלימו: _WORD / _HIELD / _WORD / _CROLL"
  - type: play_minigame
    minigame_id: word_matching
    world_object_id: WoodenCart2_Solitude_Tower
    difficulty: 3
    success_required: true
    instance_id: noun_repair_q05_animals
    display_text: "השלימו nouns של חיות: _RAGON / _RABBIT / _OG / _AT"
  - type: play_minigame
    minigame_id: speak_aloud
    world_object_id: WoodenCart2_Solitude_Tower
    difficulty: 4
    success_required: true
    instance_id: noun_repair_q05_say
    reward_item_id: power_stone
    reward_amount: 1
    display_text: "אמרו בקול: castle, queen, throne"
  - type: deliver_item
    npc_id: Professor Crazy
    item_id: power_stone
    amount: 1
    dialogue_id: noun_repair_q05_finish
    display_text: "חזרו ל־Professor Crazy עם Power Stone"
