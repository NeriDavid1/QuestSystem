quest:
  id: q06_the_great_noun_reopening
  name: "The Great Noun Reopening"
  level_required: 1
  giver_npc: teacher_maya
  prerequisite: q05_the_castle_label_crisis
  summary: "חזרו ל־Maya למבחן הגדול: החזירו שמות לאנשים, חפצים, מקומות וחיות ופתחו את הספר."
  wait_for_npc_turn_in: false
rewards:
  xp: 300
  items:
    - id: coin
      amount: 10
steps:
  - type: talk_to_npc
    npc_id: teacher_maya
    dialogue_id: noun_repair_q06_start
  - type: play_minigame
    minigame_id: word_matching
    world_object_id: Exam_Table_Fairy_Rose_Park
    difficulty: 3
    success_required: true
    instance_id: noun_repair_q06_people
    display_text: "השלימו nouns של אנשים: _OY / _IRL / _ING / _UEEN"
  - type: play_minigame
    minigame_id: letter_ordering
    world_object_id: Exam_Table_Fairy_Rose_Park
    difficulty: 3
    success_required: true
    instance_id: noun_repair_q06_book
    display_text: "סדרו את האותיות של NOUN"
  - type: play_minigame
    minigame_id: word_matching
    world_object_id: Exam_Table_Fairy_Rose_Park
    difficulty: 3
    success_required: true
    instance_id: noun_repair_q06_places
    display_text: "השלימו nouns של מקומות: _ASTLE / _ATE / _ARK / _OWER"
  - type: play_minigame
    minigame_id: word_ordering
    world_object_id: Exam_Table_Fairy_Rose_Park
    difficulty: 3
    success_required: true
    instance_id: noun_repair_q06_sentence
    display_text: "בנו משפט: The dog sees the castle"
  - type: play_minigame
    minigame_id: word_matching
    world_object_id: Exam_Table_Fairy_Rose_Park
    difficulty: 3
    success_required: true
    instance_id: noun_repair_q06_animals
    display_text: "השלימו nouns של חיות: _OG / _AT / _ISH / _IRD"
  - type: play_minigame
    minigame_id: word_matching
    world_object_id: Exam_Table_Fairy_Rose_Park
    difficulty: 3
    success_required: true
    instance_id: noun_repair_q06_objects
    display_text: "השלימו nouns של חפצים: _OOK / _ABLE / _EN / _AG"
  - type: play_minigame
    minigame_id: speak_aloud
    world_object_id: Exam_Table_Fairy_Rose_Park
    difficulty: 4
    success_required: true
    instance_id: noun_repair_q06_say
    reward_item_id: ancient_rune
    reward_amount: 1
    display_text: "אמרו בקול: noun, book, dragon"
  - type: deliver_item
    npc_id: teacher_maya
    item_id: ancient_rune
    amount: 1
    dialogue_id: noun_repair_q06_finish
    display_text: "חזרו ל־Maya עם Ancient Rune לפתיחת הספר"
