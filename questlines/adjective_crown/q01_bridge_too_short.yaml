quest:
  id: q01_bridge_too_short
  name: The Bridge Is Too Short
  level_required: 1
  giver_npc: teacher_maya
  prerequisite: null
  summary: Spell LONG at the existing short bridge, receive one Oak Log, and deliver
    it to Maya.
  wait_for_npc_turn_in: false
rewards:
  xp: 50
  items: []
steps:
  - type: talk_to_npc
    npc_id: teacher_maya
    dialogue_id: adjective_knight_oak_log_request
  - type: reach_location
    location_id: The Oathstone Bridge
    display_text: Reach The Oathstone Bridge
  - type: play_minigame
    minigame_id: letter_ordering
    world_object_id: WoodenCart3_The_Oath_stone_Bridge
    difficulty: 1
    success_required: true
    instance_id: q01_bridge_too_short_s2
    reward_item_id: oak_log
    reward_amount: 1
    display_text: "זוכרים איך כותבים את המילה?"
  - type: deliver_item
    npc_id: teacher_maya
    item_id: oak_log
    amount: 1
    dialogue_id: adjective_knight_oak_log_delivered
    display_text: Deliver 1 oak log to Maya
