name: Deploy QuestForge site to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build creator catalog + Hebrew viewer
        env:
          # The anon key is intentionally public; RLS still exposes published
          # snapshots only. Leave these unset to keep the YAML fallback.
          QUEST_SUPABASE_URL: ${{ vars.QUEST_SUPABASE_URL }}
          QUEST_SUPABASE_ANON_KEY: ${{ secrets.QUEST_SUPABASE_ANON_KEY }}
        run: python scripts/build_all.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: editor/package-lock.json

      - name: Install editor dependencies
        # Prefer a clean lockfile install; fall back if optional platform deps drift.
        run: npm ci || npm install
        working-directory: editor

      - name: Build authenticated quest editor
        env:
          VITE_SUPABASE_URL: ${{ vars.QUEST_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.QUEST_SUPABASE_ANON_KEY }}
          VITE_BASE_PATH: ${{ vars.QUEST_EDITOR_BASE_PATH || format('/{0}/editor/', github.event.repository.name) }}
        run: npm run build
        working-directory: editor

      - name: Assemble Pages site
        shell: bash
        run: |
          rm -rf site
          mkdir -p site/editor
          cp -R presentation/. site/
          cp -R editor/dist/. site/editor/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
